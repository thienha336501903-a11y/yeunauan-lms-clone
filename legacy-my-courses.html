<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Khóa Học Của Tôi</title>
<style>
:root{--bg:#0a0c10;--card:#0e1217;--card2:#181e24;--border:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#f59e0b;--accent2:#d97706;--green:#22c55e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:max(28px,env(safe-area-inset-bottom))}button,input{font:inherit}.container{max-width:1200px;margin:0 auto;padding:2rem 1.5rem;min-height:100vh}.loginCard{max-width:440px;padding:2rem 1.5rem;background:var(--card);border:1px solid var(--border);border-radius:16px;margin:60px auto;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.28)}.lock{display:inline-flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#3b82f6;margin-bottom:1.5rem;font-size:38px}.loginTitle{font-size:1.85rem;font-weight:800;margin:0 0 1.2rem}.loginText{color:var(--text);font-size:.95rem;line-height:1.6;margin:0 0 20px}.helper{background:rgba(255,255,255,.03);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.05);text-align:left;margin-top:1.5rem}.helperTitle{font-weight:800;color:#fbbf24;font-size:.85rem;margin-bottom:4px}.helper p{font-size:.85rem;color:var(--muted);line-height:1.45;margin:0}.homeBtn,.logoutBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.65rem 1.1rem;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text);font-weight:700;text-decoration:none;cursor:pointer}.homeBtn{width:100%;margin-top:1.5rem;font-size:.8rem}.floating{position:fixed;top:12px;right:16px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}.floatingArrow{font-size:2rem;line-height:1;color:#fbbf24;animation:floatArrow .8s infinite alternate ease-in-out;margin-bottom:4px}.floatingText{background:#fbbf24;color:#000;padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap}@keyframes floatArrow{to{transform:translate(4px,-4px) scale(1.15)}}.coursesHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem;border-bottom:1px solid var(--border);padding-bottom:1.5rem;gap:1.5rem}.coursesHeaderTitle{display:flex;align-items:center;gap:.75rem}.grad{font-size:28px;color:var(--accent)}.mainTitle{font-size:2rem;line-height:1.1;margin:0;font-weight:800;background:linear-gradient(135deg,#fff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.email{font-size:.95rem;color:var(--muted);margin:.25rem 0 0}.logoutBtn{color:var(--muted);font-size:.85rem}.search{position:relative;margin-bottom:30px}.search input{width:100%;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:12px;padding:14px 16px 14px 44px;outline:none}.search:before{content:'⌕';position:absolute;left:16px;top:9px;color:var(--muted);font-size:23px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.course{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-height:100%}.imageWrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--card2)}.courseImg{width:100%;height:100%;object-fit:cover}.placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:48px;color:#4b5563}.badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:8px;font-size:.8rem;font-weight:800}.pending{background:#fbbf24;color:#000}.waiting{background:#f97316;color:#fff}.ready{background:#22c55e;color:#fff}.content{padding:1.25rem;display:flex;flex-direction:column;flex:1}.title{font-size:1.15rem;font-weight:800;margin:0 0 8px;color:#fff;line-height:1.4}.meta{font-size:.85rem;color:var(--muted);margin-bottom:6px;line-height:1.4}.meta strong{color:#fff;word-break:break-all}.drive{font-size:.85rem;color:var(--muted);margin:6px 0 12px}.drive span{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:800}.drive-ok{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}.drive-wait{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}.drive-bad{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25)}.drive-none{background:rgba(156,163,175,.15);color:#d1d5db;border:1px solid rgba(156,163,175,.25)}.stateBox{padding:10px 12px;border-radius:10px;margin:6px 0 16px}.stateBox b{display:block;font-size:.85rem;margin-bottom:3px}.stateBox p{font-size:.8rem;color:#d1d5db;margin:0;line-height:1.4}.state-pending{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.1)}.state-pending b{color:#fbbf24}.state-wait{background:rgba(234,88,12,.05);border:1px solid rgba(234,88,12,.1)}.state-wait b{color:#f97316}.state-ready{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.1)}.state-ready b{color:#4ade80}.action{margin-top:auto}.disabled,.enter{width:100%;padding:12px;border:0;border-radius:12px;font-size:.9rem;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;text-decoration:none}.disabled{background:#1f2937;color:#9ca3af}.enter{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}.empty,.loading,.errorCard{max-width:560px;margin:60px auto;padding:28px;text-align:center;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--muted)}.errorCard{color:#f87171}.googleWrap{display:flex;justify-content:center;min-height:44px;margin:12px 0}.hidden{display:none!important}@media(max-width:640px){.container{padding:1.25rem 1rem}.coursesHeader{flex-direction:column;align-items:flex-start;gap:1rem}.mainTitle{font-size:1.65rem}.loginCard{margin:48px auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="floating" class="floating hidden"><div class="floatingArrow">↗️</div><div class="floatingText">Bấm dấu ⋯ ở đây</div></div>
<main class="container"><div id="app"><div class="loading">Đang kiểm tra phiên học viên…</div></div></main>
<script>
(()=>{
const app=document.getElementById('app');
const floating=document.getElementById('floating');
let sessionToken='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function isInAppIOS(){const ua=String(navigator.userAgent||'');return /iPhone|iPad|iPod/i.test(ua)&&(/Zalo/i.test(ua)||/(FBAN|FBAV)/i.test(ua))}
function showInApp(){floating.classList.remove('hidden');app.innerHTML=`<div class="loginCard"><div style="font-size:1.75rem;margin-bottom:1rem">🔒</div><h2 class="loginTitle" style="font-size:1.25rem;margin-bottom:1.5rem">Bạn đã thanh toán thành công, tiếp tục mở mục Quản lý khóa học để xem</h2><div class="helper"><div class="helperTitle">💡 Đang mở trong Zalo/Facebook?</div><p>Bấm dấu <strong style="color:#fff">⋯</strong> ở góc trên bên phải → chọn <strong style="color:#fff">“Mở bằng Safari”</strong> hoặc <strong style="color:#fff">“Mở bằng trình duyệt”</strong> để đăng nhập Gmail.</p></div><a class="homeBtn" href="/">← Quay về Trang chủ</a></div>`}
async function callDashboard(payload={}){const body={...payload};if(sessionToken&&!body.credential&&!body.accessToken)body.sessionToken=sessionToken;const r=await fetch('/api/lms/portal?endpoint=student-dashboard',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});let d={};try{d=await r.json()}catch{}return{r,d}}
function courseState(c){if(c.state==='ready')return'approved_ready';if(c.state==='approved_waiting_content')return'approved_waiting_content';return'pending_order'}
function driveBadge(v){const s=String(v||'').toLowerCase();if(s==='success')return'<span class="drive-ok">🟢 Drive đã sẵn sàng</span>';if(s==='pending_retry'||s==='quota_limited')return'<span class="drive-wait">🟡 Drive đang chờ cấp quyền</span>';if(s==='failed'||s==='error')return'<span class="drive-bad">🔴 Drive lỗi, liên hệ admin</span>';return'<span class="drive-none">⚪ Đang chờ xử lý</span>'}
function fmtDate(v){if(!v)return'Đang xử lý';try{return new Date(v).toLocaleDateString('vi-VN',{year:'numeric',month:'short',day:'numeric'})}catch{return'Đang xử lý'}}
function render(data){sessionToken=String(data.sessionToken||sessionToken||'');const email=String(data.email||'');const courses=(Array.isArray(data.courses)?data.courses:[]).filter(c=>String(c.deliveryMode||'lms').toLowerCase()==='lms'&&!['rejected','inactive'].includes(c.state));app.innerHTML=`<div class="coursesHeader"><div class="coursesHeaderTitle"><div class="grad">🎓</div><div><h1 class="mainTitle">Khóa Học Của Tôi</h1><p class="email">Học viên: <strong>${esc(email)}</strong></p></div></div><button id="logout" class="logoutBtn">↪ Đăng xuất</button></div><div class="search"><input id="search" type="text" placeholder="Tìm kiếm nhanh khóa học của bạn..."></div><div id="courses"></div>`;document.getElementById('logout').onclick=()=>{sessionToken='';document.cookie='course_session_token=; Path=/; Max-Age=0; SameSite=Lax';location.reload()};const root=document.getElementById('courses');function draw(q=''){const list=courses.filter(c=>String(c.title||'').toLowerCase().includes(q.trim().toLowerCase()));if(!list.length){root.innerHTML='<div class="empty">'+(q?'Không tìm thấy khóa học nào phù hợp với tìm kiếm.':'Tài khoản của bạn chưa có khóa học LMS nào.')+'</div>';return}root.innerHTML='<div class="grid">'+list.map(c=>{const st=courseState(c),pending=st==='pending_order',waiting=st==='approved_waiting_content',ready=st==='approved_ready',label=pending?'🟡 Chờ duyệt':waiting?'🟠 Chờ lên bài':'🟢 Sẵn sàng',badge=pending?'pending':waiting?'waiting':'ready',dateLabel=pending?'Ngày đăng ký':'Ngày duyệt',img=c.imageUrl?`<img class="courseImg" src="${esc(c.imageUrl)}" alt="">`:'<div class="placeholder">📖</div>',stateBox=pending?'<div class="stateBox state-pending"><b>🟡 Đã đăng ký thành công</b><p>Đơn đăng ký của bạn đã được ghi nhận. Admin sẽ xét duyệt trong vòng 24 giờ.</p></div>':waiting?'<div class="stateBox state-wait"><b>🟠 Lớp đang chờ lên bài</b><p>Khóa học của bạn đã được xét duyệt. Hệ thống sẽ gửi Gmail khi lớp học hoàn tất.</p></div>':'<div class="stateBox state-ready"><b>🟢 Đã có nội dung</b><p>Khóa học của bạn đã hoàn tất nội dung. Bạn có thể vào học ngay bây giờ.</p></div>',action=pending?'<button class="disabled" disabled>Chờ xét duyệt</button>':waiting?'<button class="disabled" disabled>Chưa có bài học</button>':`<a class="enter" href="/post/${encodeURIComponent(c.slug)}">Vào học ngay &nbsp;→</a>`;return`<article class="course"><div class="imageWrap">${img}<span class="badge ${badge}">${label}</span></div><div class="content"><h3 class="title">${esc(c.title||c.slug)}</h3><div class="meta">Gmail học viên: <strong>${esc(email)}</strong></div><div class="meta">${dateLabel}: <strong>${fmtDate(c.updatedAt)}</strong></div>${!pending?`<div class="drive">Trạng thái Drive: ${driveBadge(c.driveStatus)}</div>`:''}${stateBox}<div class="action">${action}</div></div></article>`}).join('')+'</div>'}draw();document.getElementById('search').oninput=e=>draw(e.target.value)}
function loadGsi(clientId){return new Promise((resolve,reject)=>{if(window.google?.accounts?.id)return resolve();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=resolve;s.onerror=()=>reject(new Error('Không tải được Google'));document.body.appendChild(s)})}
async function showLogin(){let cfg={};try{cfg=await fetch('/api/lms/portal?endpoint=public-config',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json())}catch{}app.innerHTML=`<div class="loginCard"><div class="lock">🎓</div><h2 class="loginTitle">Cổng Học Viên</h2><p class="loginText">Đăng nhập bằng tài khoản Google đã mua khóa học để tra cứu và vào học các bài giảng của bạn.</p><div id="googleBtn" class="googleWrap"></div><div class="helper"><div class="helperTitle">💡 Đang mở trong Zalo/Facebook?</div><p>Bấm dấu <strong style="color:#fff">⋯</strong> ở góc trên bên phải → chọn <strong style="color:#fff">“Mở bằng trình duyệt”</strong> hoặc <strong style="color:#fff">“Open in browser”</strong>.</p></div><a class="homeBtn" href="/">← Quay về Trang chủ</a></div>`;if(!cfg.googleClientId){document.getElementById('googleBtn').innerHTML='<span style="color:#f87171">Chưa cấu hình Google Client ID</span>';return}try{await loadGsi(cfg.googleClientId);google.accounts.id.initialize({client_id:cfg.googleClientId,callback:async response=>{app.innerHTML='<div class="loading">Đang tải khóa học của bạn…</div>';const{r,d}=await callDashboard({credential:response.credential});if(r.ok&&d.success){render(d);return}showLogin()}});google.accounts.id.renderButton(document.getElementById('googleBtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'rectangular',width:280})}catch{document.getElementById('googleBtn').innerHTML='<span style="color:#f87171">Không tải được đăng nhập Google.</span>'}}
(async()=>{if(isInAppIOS()){showInApp();return}const{r,d}=await callDashboard();if(r.ok&&d.success){render(d);return}showLogin()})();
})();
</script>
</body>
</html>
