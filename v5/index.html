<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMS V5</title>
<style>
:root{--ink:#17212b;--muted:#708090;--line:#dce4e8;--green:#2cab55;--bg:#cfe2c7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#eef3f6}.shell{min-height:100vh;max-width:980px;margin:auto;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.08);display:flex;flex-direction:column}.top{height:68px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;position:sticky;top:0;z-index:4}.back{font-size:22px;text-decoration:none;color:#596a79}.title{font-weight:850}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.feed{flex:1;background-color:var(--bg);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.32) 0 2px,transparent 3px),radial-gradient(circle at 80% 60%,rgba(68,120,75,.11) 0 3px,transparent 4px);background-size:42px 42px;padding:18px 12px 40px}.lesson-label{display:flex;justify-content:center;margin:18px 0 8px}.lesson-label span{background:rgba(49,91,55,.65);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:6px 12px}.post{max-width:780px;margin:7px auto}.bubble{display:inline-block;max-width:94%;min-width:180px;background:#fff;border-radius:17px 17px 17px 5px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.11)}.text{white-space:pre-wrap;line-height:1.5}.caption{font-size:13px;color:#536676;margin-top:7px}.assets{display:flex;flex-direction:column;gap:7px;margin-top:8px}.media{overflow:hidden;border-radius:12px;background:#edf1f2;border:1px solid #e1e7ea}.media img{display:block;width:100%;max-height:580px;object-fit:contain;background:#111}.media video{display:block;width:100%;max-height:580px;background:#000}.file{display:flex;align-items:center;gap:10px;padding:11px;color:#243847;text-decoration:none;background:#f6f8fa;border:1px solid #e2e8ec;border-radius:11px}.file-icon{font-size:24px}.file-name{font-size:13px;font-weight:750;word-break:break-word}.file-size{font-size:11px;color:var(--muted);margin-top:2px}.unavailable{padding:10px;border:1px dashed #bdc8cd;border-radius:10px;font-size:12px;color:#6f7e88}.empty,.error{max-width:560px;margin:80px auto;background:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 5px 24px rgba(0,0,0,.08)}.error{color:#a4353d}@media(max-width:640px){.shell{width:100%}.feed{padding-left:8px;padding-right:8px}.bubble{max-width:97%}}
</style>
</head><body><div class="shell"><header class="top"><a class="back" href="/my-courses.html">←</a><div><div id="title" class="title">LMS V5</div><div id="subtitle" class="subtitle">Đang tải khóa học…</div></div></header><main id="feed" class="feed"><div class="empty">Đang chuẩn bị phiên phát an toàn…</div></main></div>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let activeCourse='';
function mediaUrl(assetId){return `/v5/media/${encodeURIComponent(assetId)}?course=${encodeURIComponent(activeCourse)}`}
async function ensureMediaWorker(){if(!('serviceWorker' in navigator))throw new Error('Trình duyệt này không hỗ trợ phát media V5 an toàn.');await navigator.serviceWorker.register('/v5/media-sw.js',{scope:'/v5/',updateViaCache:'none'});await navigator.serviceWorker.ready;if(navigator.serviceWorker.controller)return;await new Promise((resolve,reject)=>{let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',onChange);ok?resolve():reject(new Error('Không thể kích hoạt bộ phát media V5. Hãy tải lại trang.'))};const onChange=()=>navigator.serviceWorker.controller&&finish(true);const timer=setTimeout(()=>finish(Boolean(navigator.serviceWorker.controller)),5000);navigator.serviceWorker.addEventListener('controllerchange',onChange)});if(!navigator.serviceWorker.controller)throw new Error('Bộ phát media V5 chưa kiểm soát trang này.')}
async function load(){activeCourse=new URLSearchParams(location.search).get('course')||'';if(!activeCourse){$('feed').innerHTML='<div class="error">Thiếu course slug.</div>';return}try{await ensureMediaWorker();const res=await fetch(`/api/lms/portal?endpoint=v5-feed&course=${encodeURIComponent(activeCourse)}`,{cache:'no-store',credentials:'include'});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||`HTTP ${res.status}`);$('title').textContent=data.course?.title||activeCourse;$('subtitle').textContent=data.course?.subtitle||'Khóa học V5';render(data)}catch(error){$('feed').innerHTML=`<div class="error"><strong>Không thể mở khóa học</strong><p>${esc(error.message)}</p><a href="/my-courses.html">Quay lại Khóa học của tôi</a></div>`}}
function render(data){const lessons=data.lessons||[],posts=data.posts||[],links=data.links||[],assetMap=new Map((data.assets||[]).map(a=>[a.id,a]));let html='';for(const lesson of lessons){html+=`<div class="lesson-label"><span>${esc(lesson.title)}</span></div>`;for(const post of posts.filter(p=>p.lesson_id===lesson.id))html+=postHtml(post,links,assetMap)}const loose=posts.filter(p=>!p.lesson_id);if(loose.length){html+='<div class="lesson-label"><span>Nội dung bổ sung</span></div>';for(const post of loose)html+=postHtml(post,links,assetMap)}$('feed').innerHTML=html||'<div class="empty">Khóa học chưa có nội dung được Publish.</div>'}
function postHtml(post,links,assets){const media=links.filter(l=>l.post_id===post.id).sort((a,b)=>a.position-b.position).map(link=>assets.get(link.asset_id)).filter(Boolean).map(assetHtml).join('');return `<div class="post"><div class="bubble">${post.text_content?`<div class="text">${esc(post.text_content)}</div>`:''}${post.caption?`<div class="caption">${esc(post.caption)}</div>`:''}${media?`<div class="assets">${media}</div>`:''}</div></div>`}
function assetHtml(a){if(!a.playback_ready)return`<div class="unavailable">${esc(a.original_filename||a.type)} — media chưa sẵn sàng phát.</div>`;const url=mediaUrl(a.id);if(a.type==='video')return`<div class="media"><video controls playsinline preload="metadata" controlslist="nodownload" src="${esc(url)}"></video></div>`;if(a.type==='image')return`<div class="media"><img loading="lazy" src="${esc(url)}" alt="${esc(a.original_filename||'Ảnh bài học')}"></div>`;return`<a class="file" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-icon">📎</span><span><div class="file-name">${esc(a.original_filename||'Tài liệu')}</div><div class="file-size">${formatBytes(a.bytes)} · Mở tài liệu</div></span></a>`}
function formatBytes(v){const n=Number(v||0);if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;if(n<1073741824)return`${(n/1048576).toFixed(1)} MB`;return`${(n/1073741824).toFixed(2)} GB`}
load();
</script></body></html>
