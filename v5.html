<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMS V5</title>
  <style>
    :root{--ink:#17212b;--muted:#708090;--line:#dce4e8;--green:#2cab55;--bg:#cfe2c7}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#eef3f6}.shell{min-height:100vh;max-width:980px;margin:auto;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.08);display:flex;flex-direction:column}.top{height:68px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;position:sticky;top:0;z-index:4}.back{font-size:22px;text-decoration:none;color:#596a79}.title{font-weight:850}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.feed{flex:1;background-color:var(--bg);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.32) 0 2px,transparent 3px),radial-gradient(circle at 80% 60%,rgba(68,120,75,.11) 0 3px,transparent 4px);background-size:42px 42px;padding:18px 12px 40px}.lesson-label{display:flex;justify-content:center;margin:18px 0 8px}.lesson-label span{background:rgba(49,91,55,.65);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:6px 12px}.post{max-width:780px;margin:7px auto}.bubble{display:inline-block;max-width:94%;min-width:180px;background:#fff;border-radius:17px 17px 17px 5px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.11)}.text{white-space:pre-wrap;line-height:1.5}.caption{font-size:13px;color:#536676;margin-top:7px}.assets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:8px}.asset{background:#f6f8fa;border:1px solid #e2e8ec;border-radius:11px;padding:10px;font-size:12px}.asset.video:before{content:'▶ ';color:#7258df}.asset.image:before{content:'▣ ';color:#2eae5e}.asset.document:before{content:'📎 '}.empty,.error{max-width:560px;margin:80px auto;background:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 5px 24px rgba(0,0,0,.08)}.error{color:#a4353d}@media(max-width:640px){.shell{width:100%}.feed{padding-left:8px;padding-right:8px}.bubble{max-width:97%}}
  </style>
</head>
<body>
<div class="shell"><header class="top"><a class="back" href="/my-courses.html">←</a><div><div id="title" class="title">LMS V5</div><div id="subtitle" class="subtitle">Đang tải khóa học…</div></div></header><main id="feed" class="feed"><div class="empty">Đang tải nội dung…</div></main></div>
<script>
  const $=id=>document.getElementById(id);const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function load(){const course=new URLSearchParams(location.search).get('course')||'';if(!course){$('feed').innerHTML='<div class="error">Thiếu course slug.</div>';return}try{const res=await fetch(`/api/lms/portal?endpoint=v5-feed&course=${encodeURIComponent(course)}`,{cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||`HTTP ${res.status}`);$('title').textContent=data.course?.title||course;$('subtitle').textContent=data.course?.subtitle||'Khóa học V5';render(data)}catch(error){$('feed').innerHTML=`<div class="error"><strong>Không thể mở khóa học</strong><p>${escapeHtml(error.message)}</p><a href="/my-courses.html">Quay lại Khóa học của tôi</a></div>`}}
  function render(data){const lessons=data.lessons||[],posts=data.posts||[],links=data.links||[],assetMap=new Map((data.assets||[]).map(a=>[a.id,a]));let html='';for(const lesson of lessons){html+=`<div class="lesson-label"><span>${escapeHtml(lesson.title)}</span></div>`;for(const post of posts.filter(p=>p.lesson_id===lesson.id))html+=postHtml(post,links,assetMap)}const loose=posts.filter(p=>!p.lesson_id);if(loose.length){html+='<div class="lesson-label"><span>Nội dung bổ sung</span></div>';for(const post of loose)html+=postHtml(post,links,assetMap)}$('feed').innerHTML=html||'<div class="empty">Khóa học chưa có nội dung được Publish.</div>'}
  function postHtml(post,links,assets){const postLinks=links.filter(l=>l.post_id===post.id).sort((a,b)=>a.position-b.position);const media=postLinks.map(link=>{const a=assets.get(link.asset_id);if(!a)return'';return `<div class="asset ${escapeHtml(a.type)}">${escapeHtml(a.original_filename||a.type)}${a.bytes?` · ${formatBytes(a.bytes)}`:''}</div>`}).join('');return `<div class="post"><div class="bubble">${post.text_content?`<div class="text">${escapeHtml(post.text_content)}</div>`:''}${post.caption?`<div class="caption">${escapeHtml(post.caption)}</div>`:''}${media?`<div class="assets">${media}</div>`:''}</div></div>`}
  function formatBytes(v){const n=Number(v||0);if(n<1024)return`${n} B`;if(n<1024*1024)return`${(n/1024).toFixed(1)} KB`;if(n<1024*1024*1024)return`${(n/1024/1024).toFixed(1)} MB`;return`${(n/1024/1024/1024).toFixed(2)} GB`}
  load();
</script>
</body>
</html>
