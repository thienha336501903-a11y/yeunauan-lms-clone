<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V3 - Telegram Channel LMS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#dbe7ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#243746}.card{width:min(520px,100%);background:#fff;border-radius:18px;box-shadow:0 12px 38px rgba(41,76,99,.16);overflow:hidden}.head{background:#5682a3;color:#fff;padding:20px}.head h1{font-size:19px;margin:0 0 5px}.head p{font-size:12px;opacity:.82;margin:0}.body{padding:18px}.status{text-align:center;color:#71818d;font-size:13px;padding:18px}.spin{width:34px;height:34px;border:3px solid #dce7ed;border-top-color:#5682a3;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.signin{display:none;text-align:center;padding:8px 0 14px}.signin p{font-size:12px;color:#687984;line-height:1.5}.google{display:flex;justify-content:center}.courses{display:grid;gap:9px}.course{display:flex;align-items:center;gap:11px;width:100%;border:1px solid #dfe8ed;background:#f8fbfc;border-radius:13px;padding:12px;text-decoration:none;color:#233947}.avatar{width:42px;height:42px;border-radius:50%;background:#5682a3;color:#fff;display:grid;place-items:center;font-weight:800}.meta{min-width:0;flex:1}.name{font-weight:750;font-size:14px}.slug{font-size:11px;color:#82919b;margin-top:3px}.error{color:#a74444;line-height:1.5}.notice{font-size:12px;line-height:1.55;padding:12px;border-radius:11px;background:#fff7e8;color:#7b5b24;border:1px solid #f0d8aa;margin-bottom:10px}.back{display:block;text-align:center;margin-top:15px;color:#5682a3;text-decoration:none;font-size:12px;font-weight:700}.retry{border:0;border-radius:10px;background:#5682a3;color:#fff;font-weight:700;font-size:12px;padding:9px 14px;cursor:pointer;margin-top:10px}
</style>
</head>
<body><div class="card"><div class="head"><h1>V3 — Telegram Channel LMS</h1><p>Đang xác thực phiên học viên trước khi mở kênh.</p></div><div class="body"><div id="status" class="status"><div class="spin"></div>Đang kiểm tra phiên học viên…</div><div id="signin" class="signin"><p>Chưa có phiên hội viên hợp lệ. Hãy đăng nhập Gmail đã được cấp quyền.</p><div id="googleBtn" class="google"></div></div><div id="courses" class="courses"></div><a class="back" href="/">← Về hệ thống LMS Clone</a></div></div>
<script>
(()=>{
const K='v3_course_session_token',qs=new URLSearchParams(location.search),requested=String(qs.get('course')||'').trim(),status=document.getElementById('status'),signin=document.getElementById('signin'),list=document.getElementById('courses'),googleBtn=document.getElementById('googleBtn');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),norm=v=>String(v||'').trim().toLowerCase();let googleInit=false;
function headers(){try{const sid=localStorage.getItem('lms_verified_session_id')||localStorage.getItem('lms_session_id')||'',did=localStorage.getItem('lms_device_id')||'';return sid&&did?{'X-LMS-Session-Id':sid,'X-LMS-Device-Id':did}:{}}catch{return {}}}
function token(){try{return sessionStorage.getItem(K)||''}catch{return ''}}function save(t){try{if(t)sessionStorage.setItem(K,String(t))}catch{}}function clear(){try{sessionStorage.removeItem(K)}catch{}}
async function post(endpoint,payload){const r=await fetch('/api/lms/portal?endpoint='+endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify(payload||{})});let d={};try{d=await r.json()}catch{}return {r,d}}
async function bootstrap(credential=''){const p={};if(token())p.sessionToken=token();if(credential)p.credential=credential;try{const {r,d}=await post('v3-bootstrap',p);if(r.ok&&d.success){save(d.sessionToken);return d}if(r.status===401||d.authError==='missing_login_session')clear();return {bad:true,status:r.status,...d}}catch(e){return {bad:true,error:e.message||String(e)}}}
async function openCourse(slug){status.style.display='block';signin.style.display='none';list.innerHTML='';status.innerHTML='<div class="spin"></div>Đang kiểm tra quyền khóa học…';const p={course:slug};if(token())p.sessionToken=token();let out;try{out=await post('course-data',p)}catch(e){status.innerHTML='<div class="error">'+esc(e.message||e)+'</div>';return}const {r,d}=out;if(r.ok&&d.allowed){save(d.sessionToken);location.replace('/channel-candidate.html?course='+encodeURIComponent(d.course||slug));return}const a=String(d.authError||d.code||'');if(['entry_token_required','protected_session_invalid','invalid_lms_session'].includes(a)){status.innerHTML='<div class="notice">Khóa này yêu cầu phiên từ Cổng học viên. Hãy mở khóa từ Cổng học viên Clone một lần rồi quay lại V3.</div><a class="course" href="/"><span class="avatar">↩</span><span class="meta"><span class="name">Mở Cổng học viên Clone</span><span class="slug">Tạo lại phiên bảo vệ cho khóa</span></span><span>›</span></a>';return}if(r.status===401||a==='missing_login_session'){clear();await showLogin('Phiên học viên đã mất. Hãy đăng nhập lại Gmail.');return}status.innerHTML='<div class="error">'+esc(d.error||'Không mở được khóa học.')+'</div><button class="retry" onclick="location.reload()">Thử lại</button>'}
async function consume(data){const cs=Array.isArray(data.allowedCourses)?data.allowedCourses:[];if(!cs.length){status.innerHTML='<div class="error">Tài khoản chưa có khóa học đang hoạt động.</div>';return}if(requested){const m=cs.find(x=>x.slug===requested)||cs.find(x=>norm(x.slug)===norm(requested));if(m){await openCourse(m.slug);return}}status.style.display='none';signin.style.display='none';list.innerHTML='';if(requested){const w=document.createElement('div');w.className='notice';w.textContent='Tài khoản hiện tại không có quyền khóa “'+requested+'”. Hãy chọn khóa được cấp quyền.';list.appendChild(w)}for(const c of cs){const slug=String(c.slug||'').trim();if(!slug)continue;const title=String(c.title||slug).trim()||slug,a=document.createElement('a');a.className='course';a.href='/v3?course='+encodeURIComponent(slug);a.innerHTML='<span class="avatar">'+esc(title.charAt(0).toUpperCase())+'</span><span class="meta"><span class="name">'+esc(title)+'</span><span class="slug">'+esc(slug)+'</span></span><span>›</span>';list.appendChild(a)}if(!requested&&cs.length===1)setTimeout(()=>location.href='/v3?course='+encodeURIComponent(cs[0].slug),220)}
function waitGoogle(){return new Promise((ok,no)=>{let n=0,t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);ok()}else if(++n>80){clearInterval(t);no(new Error('Google Identity chưa tải được'))}},100)})}
async function showLogin(message=''){status.style.display='none';list.innerHTML='';signin.style.display='block';if(message)signin.querySelector('p').textContent=message;try{const cfg=await fetch('/api/lms/portal?endpoint=public-config',{credentials:'same-origin'}).then(r=>r.json());if(!cfg.googleClientId)throw new Error('Thiếu Google Client ID');await waitGoogle();if(googleInit)return;googleInit=true;google.accounts.id.initialize({client_id:cfg.googleClientId,callback:async x=>{signin.style.display='none';status.style.display='block';status.innerHTML='<div class="spin"></div>Đang tạo phiên học viên…';const d=await bootstrap(x.credential||'');if(d.bad){await showLogin(d.error||'Không tạo được phiên học viên.');return}await consume(d)}});google.accounts.id.renderButton(googleBtn,{theme:'outline',size:'large',shape:'pill',text:'signin_with',locale:'vi'})}catch(e){signin.innerHTML='<div class="error">Không tải được đăng nhập Google: '+esc(e.message||e)+'</div><button class="retry" onclick="location.reload()">Thử lại</button>'}}
(async()=>{const d=await bootstrap();if(d.bad){if(d.status===401||d.authError==='missing_login_session'){await showLogin();return}status.innerHTML='<div class="error">'+esc(d.error||'Không kiểm tra được tài khoản.')+'</div>';return}await consume(d)})();
})();
</script></body></html>
