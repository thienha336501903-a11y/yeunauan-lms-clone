<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5a8f58">
  <title>Đang mở khóa học…</title>
</head>
<body>
  <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:24px;text-align:center;color:#365c3d">Đang chuẩn bị phiên học an toàn…</div>
  <script>
  (() => {
    const target = '/v5/' + location.search + location.hash;
    const go = () => location.replace(target);

    if (!('serviceWorker' in navigator)) {
      go();
      return;
    }

    function waitForActive(registration) {
      if (registration.active) return Promise.resolve();
      const worker = registration.installing || registration.waiting;
      if (!worker) return Promise.resolve();
      return new Promise(resolve => {
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          resolve();
        };
        const timer = setTimeout(finish, 1800);
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') finish();
        });
      });
    }

    navigator.serviceWorker
      .register('/v5/media-sw.js', { scope: '/v5/', updateViaCache: 'none' })
      .then(waitForActive)
      .catch(() => {})
      .then(go);
  })();
  </script>
</body>
</html>
