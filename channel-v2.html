<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Telegram Channel Feed V2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe7ef}
    iframe{display:block;width:100%;height:100%;border:0;background:#dbe7ef}
  </style>
</head>
<body>
<iframe id="feed" title="Telegram Channel Feed V2"></iframe>
<script>
(() => {
  const frame=document.getElementById('feed');
  const target=new URL('/channel.html',location.origin);
  target.search=location.search;
  frame.src=target.toString();

  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('tg-smart-layout-style'))return;
    const style=doc.createElement('style');
    style.id='tg-smart-layout-style';
    style.textContent=`
      .tg-smart-album{display:grid;gap:2px;border-radius:8px;overflow:hidden;background:#dce5ea;margin-top:0;isolation:isolate}
      .tg-smart-album .img-wrap,.tg-smart-album .video-card{position:relative!important;margin:0!important;border-radius:0!important;overflow:hidden!important;background:#17212b!important;min-width:0!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important}
      .tg-smart-album .img-wrap>a,.tg-smart-album .video-card>.video-cover{position:absolute!important;inset:0!important;display:block!important}
      .tg-smart-album .img-wrap img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;object-fit:cover!important;background:#17212b!important}
      .tg-smart-album .video-card iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:.88!important;filter:brightness(.82)!important}
      .tg-smart-album .video-cover{display:grid!important;place-items:center!important;background:rgba(15,23,30,.08)!important}
      .tg-smart-album .play{width:50px!important;height:50px!important;font-size:22px!important;background:rgba(24,35,45,.68)!important;box-shadow:0 3px 18px rgba(0,0,0,.35)!important}
      .tg-smart-album .video-name{display:none!important}
      .tg-smart-album.layout-one{display:block;background:#17212b}.tg-smart-album.layout-one>*{width:100%;aspect-ratio:var(--single-ratio,1.45);max-height:540px}
      .tg-smart-album.layout-two-side{grid-template-columns:repeat(2,minmax(0,1fr));height:370px}.tg-smart-album.layout-two-stack{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));height:500px}
      .tg-smart-album.layout-three-lead{grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr);grid-template-rows:repeat(2,minmax(0,1fr));height:500px}.tg-smart-album.layout-three-lead>*:first-child{grid-row:1/3}
      .tg-smart-album.layout-three-top{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1.22fr) minmax(0,.78fr);height:480px}.tg-smart-album.layout-three-top>*:first-child{grid-column:1/3}
      .tg-smart-album.layout-four-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));height:500px}.tg-smart-album.layout-four-lead{grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);grid-template-rows:repeat(3,minmax(0,1fr));height:520px}.tg-smart-album.layout-four-lead>*:first-child{grid-row:1/4}
      .tg-smart-album.layout-five{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(0,1.08fr) minmax(0,.92fr);height:500px}.tg-smart-album.layout-five>*:nth-child(1),.tg-smart-album.layout-five>*:nth-child(2){grid-column:span 3}.tg-smart-album.layout-five>*:nth-child(n+3){grid-column:span 2}
      .tg-smart-album.layout-many{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:185px}.tg-smart-album.layout-many>*{grid-column:span 2}.tg-smart-album.layout-many.rem-1>*:last-child{grid-column:span 6}.tg-smart-album.layout-many.rem-2>*:nth-last-child(-n+2){grid-column:span 3}
      @media(max-width:520px){.tg-smart-album.layout-one>*{max-height:470px}.tg-smart-album.layout-two-side{height:300px}.tg-smart-album.layout-two-stack,.tg-smart-album.layout-three-lead{height:410px}.tg-smart-album.layout-three-top{height:390px}.tg-smart-album.layout-four-grid{height:410px}.tg-smart-album.layout-four-lead{height:430px}.tg-smart-album.layout-five{height:410px}.tg-smart-album.layout-many{grid-auto-rows:135px}.tg-smart-album .play{width:42px!important;height:42px!important;font-size:19px!important}}
    `;
    doc.head.appendChild(style);

    function driveIdFromCard(card){
      const src=card.querySelector('iframe')?.getAttribute('src')||'';
      const m=src.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
      return m?m[1]:'';
    }
    function ratioOf(tile){return Number(tile.dataset.tgRatio)||1;}
    function apply(album){
      const tiles=[...album.children],n=tiles.length;if(!n)return;
      const ratios=tiles.map(ratioOf);
      album.className='tg-smart-album';
      if(n===1){album.classList.add('layout-one');album.style.setProperty('--single-ratio',String(Math.max(.68,Math.min(1.85,ratios[0]))));}
      else if(n===2)album.classList.add(ratios.every(r=>r>1.3)?'layout-two-stack':'layout-two-side');
      else if(n===3)album.classList.add(ratios[0]<.92?'layout-three-lead':'layout-three-top');
      else if(n===4)album.classList.add(ratios[0]<.82?'layout-four-lead':'layout-four-grid');
      else if(n===5)album.classList.add('layout-five');
      else{album.classList.add('layout-many');const rem=n%3;if(rem===1)album.classList.add('rem-1');if(rem===2)album.classList.add('rem-2');}
    }
    function learnRatio(tile,album){
      const img=tile.querySelector('img');
      if(img){
        const sync=()=>{if(img.naturalWidth&&img.naturalHeight){tile.dataset.tgRatio=(img.naturalWidth/img.naturalHeight).toFixed(3);apply(album);}};
        if(img.complete)sync();else img.addEventListener('load',sync,{once:true});return;
      }
      if(tile.classList.contains('video-card')){
        tile.dataset.tgRatio='1.777';
        const id=driveIdFromCard(tile);
        if(id){const probe=new Image();probe.onload=()=>{if(probe.naturalWidth&&probe.naturalHeight){tile.dataset.tgRatio=(probe.naturalWidth/probe.naturalHeight).toFixed(3);apply(album);}};probe.src=`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1000`;}
      }
    }
    function transform(media){
      if(media.dataset.tgSmart==='1')return;
      const visuals=[];
      [...media.children].forEach(child=>{
        if(child.classList.contains('image-grid')){
          [...child.querySelectorAll(':scope > .img-wrap')].forEach(tile=>visuals.push(tile));
          child.remove();
        }else if(child.classList.contains('video-card'))visuals.push(child);
      });
      if(!visuals.length){media.dataset.tgSmart='1';return;}
      const album=doc.createElement('div');album.className='tg-smart-album';
      media.insertBefore(album,media.firstChild);
      visuals.forEach(tile=>album.appendChild(tile));
      visuals.forEach(tile=>learnRatio(tile,album));
      apply(album);media.dataset.tgSmart='1';
    }
    function scan(){doc.querySelectorAll('.post .media').forEach(transform);}
    scan();
    new MutationObserver(scan).observe(doc.getElementById('feed')||doc.body,{childList:true,subtree:true});
  });
})();
</script>
</body>
</html>
