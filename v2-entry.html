<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V2 - LMS hiện tại</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fcf8f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#2d1914}.card{width:min(540px,100%);background:#fff;border:1px solid #eee4d9;border-radius:18px;box-shadow:0 12px 36px rgba(65,45,25,.12);overflow:hidden}.head{background:#2a4b2a;color:#fff;padding:20px}.head h1{font-size:19px;margin:0 0 5px}.head p{font-size:12px;opacity:.82;margin:0}.body{padding:18px}.status{text-align:center;color:#74685f;font-size:13px;padding:18px}.spin{width:34px;height:34px;border:3px solid #eadfd4;border-top-color:#2a4b2a;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.signin{display:none;text-align:center}.signin p{font-size:12px;color:#6f655f;line-height:1.5}.choose{border:0;border-radius:12px;background:#2a4b2a;color:#fff;font-weight:800;padding:11px 16px;cursor:pointer}.courses{display:grid;gap:9px}.course{display:flex;align-items:center;gap:11px;width:100%;border:1px solid #e9ded2;background:#fffaf5;border-radius:13px;padding:12px;text-decoration:none;color:#2d1914}.course:hover{border-color:#b8c7b2;background:#f6fbf4}.avatar{width:42px;height:42px;border-radius:50%;background:#2a4b2a;color:#fff;display:grid;place-items:center;font-weight:800}.meta{min-width:0;flex:1}.name{font-weight:800;font-size:14px}.slug{font-size:11px;color:#88796e;margin-top:3px}.notice{font-size:12px;line-height:1.55;padding:12px;border-radius:11px;background:#fff7e8;color:#7b5b24;border:1px solid #f0d8aa;margin-bottom:10px}.error{color:#a74444;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin-top:15px;color:#2a4b2a;text-decoration:none;font-size:12px;font-weight:700}
</style>
</head>
<body><div class="card"><div class="head"><h1>V2 — Hệ thống học hiện tại</h1><p>Đang xác định đúng khóa học trước khi mở LMS truyền thống.</p></div><div class="body"><div id="status" class="status"><div class="spin"></div>Đang kiểm tra phiên học viên…</div><div id="signin" class="signin"><p>Chưa có phiên học viên hợp lệ.</p><button id="choose" class="choose">Chọn tài khoản học viên Google</button></div><div id="courses" class="courses"></div><a class="back" href="/">← Về LMS Clone</a></div></div>
<script>
(()=>{
const K='v2_course_session_token',qs=new URLSearchParams(location.search),requested=String(qs.get('course')||'').trim(),status=document.getElementById('status'),signin=document.getElementById('signin'),list=document.getElementById('courses'),choose=document.getElementById('choose');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),norm=v=>String(v||'').trim().toLowerCase();
function headers(){try{const sid=localStorage.getItem('lms_verified_session_id')||localStorage.getItem('lms_session_id')||'',did=localStorage.getItem('lms_device_id')||'';return sid&&did?{'X-LMS-Session-Id':sid,'X-LMS-Device-Id':did}:{}}catch{return {}}}
function token(){try{return sessionStorage.getItem(K)||sessionStorage.getItem('v3_course_session_token')||''}catch{return ''}}function save(t){try{if(t)sessionStorage.setItem(K,String(t))}catch{}}function clear(){try{sessionStorage.removeItem(K)}catch{}}
async function bootstrap(extra={}){const p={...extra};if(token()&&!p.accessToken&&!p.credential)p.sessionToken=token();const r=await fetch('/api/lms/portal?endpoint=v3-bootstrap',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify(p)});let d={};try{d=await r.json()}catch{}if(r.ok&&d.success){save(d.sessionToken);return d}if(r.status===401)clear();return {bad:true,status:r.status,...d}}
function openCourse(slug){location.replace('/lms.html?course='+encodeURIComponent(slug));}
function consume(d){const cs=Array.isArray(d.allowedCourses)?d.allowedCourses:[];if(!cs.length){status.innerHTML='<div class="error">Tài khoản chưa có khóa học đang hoạt động.</div>';return}if(requested){const m=cs.find(x=>x.slug===requested)||cs.find(x=>norm(x.slug)===norm(requested));if(m){openCourse(m.slug);return}}status.style.display='none';signin.style.display='none';list.innerHTML='';if(requested){const w=document.createElement('div');w.className='notice';w.textContent='Tài khoản hiện tại không có quyền khóa “'+requested+'”. Hãy chọn khóa được cấp quyền.';list.appendChild(w)}for(const c of cs){const a=document.createElement('a'),slug=String(c.slug||'').trim(),title=String(c.title||slug).trim()||slug;if(!slug)continue;a.className='course';a.href='/lms.html?course='+encodeURIComponent(slug);a.innerHTML='<span class="avatar">'+esc(title.charAt(0).toUpperCase())+'</span><span class="meta"><span class="name">'+esc(title)+'</span><span class="slug">'+esc(slug)+'</span></span><span>›</span>';list.appendChild(a)}if(!requested&&cs.length===1)setTimeout(()=>openCourse(cs[0].slug),180)}
function showLogin(msg='Chưa có phiên học viên hợp lệ.'){status.style.display='none';signin.style.display='block';signin.querySelector('p').textContent=msg;list.innerHTML=''}
async function chooseAccount(){try{const cfg=await fetch('/api/lms/portal?endpoint=public-config',{credentials:'same-origin'}).then(r=>r.json());if(!cfg.googleClientId)throw new Error('Thiếu Google Client ID');if(!window.google?.accounts?.oauth2)throw new Error('Google Identity chưa tải xong');const client=google.accounts.oauth2.initTokenClient({client_id:cfg.googleClientId,scope:'openid email profile',callback:async resp=>{if(resp.error||!resp.access_token){showLogin('Không chọn được tài khoản Google.');return}signin.style.display='none';status.style.display='block';status.innerHTML='<div class="spin"></div>Đang kiểm tra quyền học…';const d=await bootstrap({accessToken:resp.access_token});if(d.bad){showLogin(d.authError==='no_active_enrollments'?'Tài khoản này chưa được cấp khóa học. Hãy chọn tài khoản học viên khác.':(d.error||'Không xác thực được tài khoản.'));return}consume(d)}});client.requestAccessToken({prompt:'select_account'})}catch(e){showLogin(e.message||String(e))}}
choose.addEventListener('click',chooseAccount);
(async()=>{const d=await bootstrap();if(d.bad){if(d.status===401||d.authError==='missing_login_session'){showLogin();return}if(d.authError==='no_active_enrollments'){showLogin('Tài khoản hiện tại chưa có khóa học. Hãy chọn tài khoản học viên Google khác.');return}status.innerHTML='<div class="error">'+esc(d.error||'Không kiểm tra được tài khoản.')+'</div>';return}consume(d)})();
})();
</script></body></html>
