<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V4 POC - Telegram Source</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dbe7ef;color:#223642;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#5682a3;color:#fff;padding:12px 14px;box-shadow:0 2px 10px #27475b33}.topin{max-width:760px;margin:auto}.title{font-weight:800;font-size:16px}.sub{font-size:11px;opacity:.85;margin-top:3px}.stats{max-width:760px;margin:12px auto;padding:0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px #35586d18}.num{font-size:18px;font-weight:850}.lab{font-size:10px;color:#74848e;margin-top:2px}.feed{max-width:760px;margin:auto;padding:0 8px 60px}.post{background:#fff;border-radius:12px 12px 12px 4px;margin:8px 0;padding:10px 11px;box-shadow:0 1px 3px #1d374726}.meta{font-size:10px;color:#82909a;display:flex;gap:8px;justify-content:space-between}.copy{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:6px}.media{margin-top:8px;border-radius:9px;overflow:hidden;background:#eef3f6}.media img,.media video{display:block;width:100%;max-height:72vh;object-fit:contain;background:#15212a}.need{padding:14px;font-size:12px;line-height:1.5;background:#fff6e8;color:#76551f;border:1px solid #edd39d;border-radius:9px;margin-top:8px}.doc{display:block;padding:12px;text-decoration:none;color:#315d78;font-weight:700;font-size:12px}.state{max-width:560px;margin:70px auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 30px #294a5f1d}.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:10px;background:#5682a3;color:#fff;text-decoration:none;font-size:12px;font-weight:750}.warn{max-width:760px;margin:10px auto;padding:0 8px}.warnin{background:#fff7e8;border:1px solid #edd7ad;border-radius:11px;padding:10px 12px;color:#755a28;font-size:11px;line-height:1.5}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.post{border-radius:9px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="title" id="title">V4 — Telegram Source POC</div><div class="sub" id="sub">Đang kiểm tra quyền và nguồn Telegram…</div></div></header>
<div class="state" id="state"><div class="card" id="stateCard">Đang tải…</div></div>
<div class="warn" id="warn" hidden><div class="warnin">POC này cố ý phân biệt media Bot API và media cần MTProto. Video lớn không bị coi là lỗi nội dung; nó sẽ được đánh dấu để đo nhu cầu gateway trước khi quyết định kiến trúc V4 chính thức.</div></div>
<section class="stats" id="stats" hidden></section>
<main class="feed" id="feed" hidden></main>
<script>
(()=>{
const q=new URLSearchParams(location.search),course=String(q.get('course')||'').trim();
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function headers(){try{const sid=localStorage.getItem('lms_verified_session_id')||localStorage.getItem('lms_session_id')||'',did=localStorage.getItem('lms_device_id')||'';return sid&&did?{'X-LMS-Session-Id':sid,'X-LMS-Device-Id':did}:{}}catch{return {}}}
function fmtSize(n){n=Number(n||0);if(!n)return '';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function fmtDate(v){try{return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}catch{return ''}}
function state(html){$('state').hidden=false;$('stateCard').innerHTML=html}
function mediaHtml(post){const m=post.media;if(!m)return '';
 if(m.delivery==='mtproto_required')return `<div class="need"><b>Media cần MTProto gateway</b><br>${esc(m.type)} ${m.size?'· '+esc(fmtSize(m.size)):''}${m.duration?' · '+esc(m.duration)+' giây':''}<br>Phần chữ/caption đã ánh xạ đúng; file này vượt khả năng Bot API hoặc đến từ history reader.</div>`;
 if(m.delivery!=='telegram_bot_proxy'||!m.url)return `<div class="need">Có media Telegram nhưng POC chưa có đường phát an toàn cho loại này.</div>`;
 if(m.type==='photo')return `<div class="media"><img loading="lazy" src="${esc(m.url)}" alt="Ảnh Telegram"></div>`;
 if(['video','animation','video_note'].includes(m.type))return `<div class="media"><video controls preload="metadata" playsinline src="${esc(m.url)}"></video></div>`;
 return `<div class="media"><a class="doc" href="${esc(m.url)}" target="_blank" rel="noopener">Mở ${esc(m.name||m.type||'tệp')} ${m.size?'· '+esc(fmtSize(m.size)):''}</a></div>`;
}
function render(d){$('state').hidden=true;$('warn').hidden=false;$('stats').hidden=false;$('feed').hidden=false;$('title').textContent=(d.source?.title||'Telegram')+' — V4 POC';$('sub').textContent=`${d.course} · ${d.email||''} · ${d.mediaMode}`;
 const s=d.stats||{};$('stats').innerHTML=`<div class="stat"><div class="num">${esc(s.total||0)}</div><div class="lab">Bài Telegram</div></div><div class="stat"><div class="num">${esc(s.botProxy||0)}</div><div class="lab">Phát được POC</div></div><div class="stat"><div class="num">${esc(s.mtprotoRequired||0)}</div><div class="lab">Cần MTProto</div></div>`;
 $('feed').innerHTML=(d.posts||[]).map(p=>`<article class="post"><div class="meta"><span>#${esc(p.telegramMessageId||'')}</span><span>${esc(fmtDate(p.date))}</span></div>${p.text?`<div class="copy">${esc(p.text)}</div>`:''}${mediaHtml(p)}</article>`).join('')||'<div class="post">Nguồn Telegram chưa có bài nào được index.</div>';
}
async function init(){if(!course){state('Thiếu <b>?course=...</b> trong URL');return}try{const r=await fetch(`/api/lms/portal?endpoint=v4-telegram-feed&course=${encodeURIComponent(course)}`,{credentials:'same-origin',headers:headers()});let d={};try{d=await r.json()}catch{}if(r.ok&&d.success){render(d);return}if(r.status===401){state(`Chưa có phiên học viên hợp lệ.<br><a class="btn" href="/v3?course=${encodeURIComponent(course)}">Mở V3 để đăng nhập</a>`);return}if(d.code==='v4_source_not_enabled'||d.code==='telegram_source_missing'){state(`${esc(d.error||'Khóa này chưa ánh xạ Telegram V4')}<br><small>Đây là trạng thái bình thường trước bước gắn kênh test.</small>`);return}state(`<b>Không mở được POC</b><br><small>${esc(d.error||('HTTP '+r.status))}</small>`)}catch(e){state(`<b>Lỗi kết nối</b><br><small>${esc(e.message||e)}</small>`)}}
init();
})();
</script>
</body></html>
