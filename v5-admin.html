<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 Course Channel</title>
<style>
:root{--ink:#17212b;--muted:#71808d;--line:#dce4e8;--green:#2cab55;--green2:#218d46;--soft:#f4f7f9;--danger:#d94b57}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#eef3f6}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}.side{background:#fff;border-right:1px solid var(--line);padding:17px;display:flex;flex-direction:column;gap:13px;min-height:0}.brand{font-weight:900;font-size:18px}.tiny{font-size:12px;color:var(--muted)}select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.lesson-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.lesson-btn,.new-lesson{border-radius:12px;padding:10px 11px;text-align:left}.lesson-btn{border:1px solid transparent;background:transparent;color:#405362;display:flex;justify-content:space-between;gap:8px}.lesson-btn.active,.lesson-btn:hover{background:#edf8f0;border-color:#cce8d3;color:#16743a}.new-lesson{border:1px dashed #9ac9aa;background:#f5fff8;color:#187c40;font-weight:850}.main{min-width:0;height:100vh;display:flex;flex-direction:column}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.top h1{font-size:17px;margin:0}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;align-items:center;gap:8px}.status{background:#fff3d4;color:#986900;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:850}.ghost,.primary{border-radius:10px;padding:9px 12px;font-weight:800}.ghost{background:#fff;border:1px solid var(--line);color:#435461}.primary{background:var(--green);border:1px solid var(--green);color:#fff}.channel{flex:1;min-height:0;position:relative;background-color:#cfe2c7;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.34) 0 2px,transparent 3px),radial-gradient(circle at 80% 60%,rgba(68,120,75,.11) 0 3px,transparent 4px);background-size:42px 42px}.feed{height:100%;overflow:auto;padding:20px clamp(10px,4vw,58px) 185px}.empty,.auth{max-width:540px;margin:70px auto;background:rgba(255,255,255,.94);padding:24px;border-radius:18px;text-align:center;box-shadow:0 5px 22px rgba(0,0,0,.08)}.lesson-mark{display:flex;justify-content:center;max-width:800px;margin:18px auto 8px}.lesson-mark span{background:rgba(51,89,56,.65);color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:850}.post{max-width:800px;margin:7px auto}.bubble{display:inline-block;max-width:94%;min-width:190px;background:#fff;border-radius:17px 17px 17px 5px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.11);position:relative}.text{white-space:pre-wrap;line-height:1.48;font-size:15px}.post-menu{position:absolute;right:-34px;top:2px;width:29px;height:29px;border:0;border-radius:50%;background:rgba(255,255,255,.72);color:#71808d;font-size:18px}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:8px}.asset{padding:9px;background:#f6f8f9;border:1px solid #e1e7ea;border-radius:10px;font-size:12px}.asset.video:before{content:'▶ ';color:#7356df}.asset.image:before{content:'▣ ';color:#2aaa59}.asset.document:before{content:'📎 '}.asset.failed{color:#b42e3a;background:#fff1f2}.post-meta{text-align:right;color:#93a0aa;font-size:10px;margin-top:6px}.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:12px clamp(8px,4vw,58px) 17px;background:linear-gradient(transparent,rgba(207,226,199,.97) 26%)}.pending{max-width:820px;margin:0 auto 7px;display:flex;gap:6px;flex-wrap:wrap}.pending:empty{display:none}.file-chip{background:#fff;border:1px solid #dce5df;border-radius:11px;padding:7px 9px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:230px}.file-chip .progress{height:3px;background:#e7ecef;border-radius:99px;overflow:hidden;margin-top:5px}.file-chip .bar{height:100%;background:var(--green);width:0;transition:width .15s}.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px}.compose-box{flex:1;background:#fff;display:flex;align-items:flex-end;border-radius:20px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.14)}.attach{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:22px}.attach:hover{background:#f0f3f4}.compose-box textarea{flex:1;border:0;outline:0;resize:none;min-height:42px;max-height:130px;padding:10px 5px;line-height:1.4}.send{width:49px;height:49px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:20px;box-shadow:0 3px 9px rgba(44,172,85,.32)}.send:disabled{opacity:.45}.notice{position:fixed;right:16px;top:80px;z-index:20;max-width:390px;padding:11px 13px;border-radius:11px;background:#17232e;color:#fff;font-size:12px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.notice.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(15,24,31,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.dialog{width:min(440px,100%);background:#fff;border-radius:18px;padding:19px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.dialog h3{margin:0 0 11px}.dialog input,.dialog textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 10px}.actions .ghost{display:none}.feed{padding-left:8px;padding-right:8px}.composer-wrap{padding-left:7px;padding-right:7px}.bubble{max-width:97%}}
</style>
</head><body>
<div class="app"><aside class="side"><div><div class="brand">V5 Course Channel</div><div class="tiny">Đăng khóa học như một kênh Telegram</div></div><select id="courseSelect"><option value="">Đang tải khóa học…</option></select><button id="newLessonBtn" class="new-lesson">＋ Bài học mới</button><div id="lessonList" class="lesson-list"></div><div style="margin-top:auto" class="tiny">Direct Upload → R2 · Telegram chỉ là nguồn import tùy chọn.</div></aside><main class="main"><header class="top"><div><h1 id="channelTitle">Chọn khóa học</h1><div id="channelMeta" class="meta">V5 Telegram-like Composer</div></div><div class="actions"><span id="statusPill" class="status">Draft</span><button id="previewBtn" class="ghost">Xem trước</button><button id="publishBtn" class="primary">Preflight / Publish</button></div></header><section class="channel"><div id="feed" class="feed"><div class="empty">Chọn một khóa học để bắt đầu.</div></div><div class="composer-wrap"><div id="pendingFiles" class="pending"></div><div class="composer"><div class="compose-box"><button id="attachBtn" class="attach" title="Ảnh, video, file">📎</button><textarea id="composerInput" rows="1" placeholder="Broadcast a lesson message…"></textarea><input id="fileInput" type="file" multiple hidden></div><button id="sendBtn" class="send" disabled>➤</button></div></div></section></main></div>
<div id="notice" class="notice"></div><div id="lessonModal" class="modal"><div class="dialog"><h3>Tạo bài học mới</h3><input id="lessonTitleInput" placeholder="Ví dụ: Bài 03 — Làm sốt"><div class="row"><button class="ghost" data-close="lessonModal">Hủy</button><button id="confirmLessonBtn" class="primary">Tạo bài</button></div></div></div><div id="editModal" class="modal"><div class="dialog"><h3>Sửa Post</h3><textarea id="editTextInput" rows="7"></textarea><div class="row"><button id="deletePostBtn" class="ghost" style="color:var(--danger);margin-right:auto">Xóa</button><button class="ghost" data-close="editModal">Hủy</button><button id="savePostBtn" class="primary">Lưu</button></div></div></div>
<script>
const $=id=>document.getElementById(id);const state={courses:[],courseSlug:'',data:null,activeLessonId:null,editingPostId:null,busy:false,files:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(m){const n=$('notice');n.textContent=m;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),3000)}
async function api(url,options={}){const res=await fetch(url,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(res.status===401)throw Object.assign(new Error('AUTH_REQUIRED'),{auth:true});if(!res.ok||data.success===false)throw Object.assign(new Error(data.error||`HTTP ${res.status}`),{code:data.code});return data}
function showAuth(){$('feed').innerHTML='<div class="auth"><h2>Cần đăng nhập Admin</h2><p>V5 dùng phiên Admin hiện có của LMS.</p><a class="primary" style="display:inline-block;text-decoration:none" href="/admin.html">Mở LMS Admin</a></div>'}
async function loadCourses(){try{const d=await api('/api/lms/admin?endpoint=courses');const rows=Array.isArray(d)?d:(d.courses||d.data||[]);state.courses=rows;$('courseSelect').innerHTML='<option value="">Chọn khóa học…</option>'+rows.map(c=>`<option value="${esc(c.slug)}">${esc(c.title||c.courseName||c.slug)}</option>`).join('');const q=new URLSearchParams(location.search).get('course');if(q&&rows.some(c=>c.slug===q)){$('courseSelect').value=q;await chooseCourse(q)}}catch(e){e.auth?showAuth():toast(e.message)}}
async function chooseCourse(slug){state.courseSlug=slug;state.activeLessonId=null;state.files=[];renderPending();if(!slug){state.data=null;render();return}history.replaceState(null,'',`?course=${encodeURIComponent(slug)}`);await refresh()}
async function refresh(){if(!state.courseSlug)return;try{const d=await api(`/api/lms/admin?endpoint=v5-content&course=${encodeURIComponent(state.courseSlug)}`);state.data=d;if(!state.activeLessonId&&d.lessons?.length)state.activeLessonId=d.lessons[0].id;render()}catch(e){e.auth?showAuth():toast(e.message)}}
async function action(name,payload={}){if(state.busy)throw new Error('Đang xử lý thao tác khác.');state.busy=true;updateSend();try{const d=await api(`/api/lms/admin?endpoint=v5-content&course=${encodeURIComponent(state.courseSlug)}`,{method:'POST',body:JSON.stringify({action:name,course:state.courseSlug,...payload})});state.data=d.state||state.data;render();return d}finally{state.busy=false;updateSend()}}
function render(){const d=state.data;if(!d){$('channelTitle').textContent='Chọn khóa học';$('channelMeta').textContent='V5 Telegram-like Composer';$('lessonList').innerHTML='';$('feed').innerHTML='<div class="empty">Chọn một khóa học để bắt đầu.</div>';return}$('channelTitle').textContent=d.course?.title||d.course?.slug;$('channelMeta').textContent=`${d.lessons.length} bài · ${d.posts.length} post · ${d.assets.length} media`;$('statusPill').textContent=(d.config?.status||'draft').replace(/^./,x=>x.toUpperCase());$('lessonList').innerHTML=d.lessons.map(l=>`<button class="lesson-btn ${l.id===state.activeLessonId?'active':''}" data-lesson="${l.id}"><span>${esc(l.title)}</span><span class="tiny">${d.posts.filter(p=>p.lesson_id===l.id).length}</span></button>`).join('');const links=d.links||[],assets=new Map((d.assets||[]).map(a=>[a.id,a]));let html='';for(const l of d.lessons){html+=`<div class="lesson-mark" id="lesson-${l.id}"><span>${esc(l.title)}</span></div>`;for(const p of d.posts.filter(x=>x.lesson_id===l.id))html+=postHtml(p,links,assets)}for(const p of d.posts.filter(x=>!x.lesson_id))html+=postHtml(p,links,assets);$('feed').innerHTML=html||'<div class="empty"><strong>Kênh đang trống</strong><p>Tạo một Bài học, nhập text hoặc đính kèm media rồi bấm Gửi.</p></div>';document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{state.activeLessonId=b.dataset.lesson;render();document.getElementById(`lesson-${state.activeLessonId}`)?.scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));updateSend()}
function postHtml(p,links,assets){const media=links.filter(l=>l.post_id===p.id).sort((a,b)=>a.position-b.position).map(l=>assets.get(l.asset_id)).filter(Boolean);return `<div class="post"><div class="bubble"><button class="post-menu" data-edit="${p.id}">⋮</button>${p.text_content?`<div class="text">${esc(p.text_content)}</div>`:''}${media.length?`<div class="asset-grid">${media.map(a=>`<div class="asset ${esc(a.type)} ${a.status==='failed'?'failed':''}">${esc(a.original_filename||a.type)} · ${esc(a.status)}</div>`).join('')}</div>`:''}<div class="post-meta">${esc(p.status)} · ${new Date(p.updated_at||p.created_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} ✓</div></div></div>`}
function renderPending(){const box=$('pendingFiles');box.innerHTML=state.files.map((x,i)=>`<div class="file-chip"><div>${esc(x.file.name)}</div><div class="tiny">${formatBytes(x.file.size)} · ${x.status||'chờ gửi'}</div><div class="progress"><div class="bar" style="width:${x.progress||0}%"></div></div></div>`).join('')}
function updateSend(){const usable=state.courseSlug&&state.activeLessonId&&($('composerInput').value.trim()||state.files.length);$('sendBtn').disabled=state.busy||!usable}
function autoGrow(){const t=$('composerInput');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,130)+'px'}
function formatBytes(n){n=Number(n||0);if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;if(n<1073741824)return`${(n/1048576).toFixed(1)} MB`;return`${(n/1073741824).toFixed(2)} GB`}
function typeFor(file){if(file.type.startsWith('video/'))return'video';if(file.type.startsWith('image/'))return'image';if(file.type==='application/pdf'||/zip|word|excel|spreadsheet/.test(file.type))return'document';return'other'}
async function uploadFile(item,postId,position){item.status='khởi tạo';renderPending();const init=await api(`/api/lms/admin?endpoint=v5-upload&course=${encodeURIComponent(state.courseSlug)}`,{method:'POST',body:JSON.stringify({action:'init',course:state.courseSlug,postId,position,filename:item.file.name,mimeType:item.file.type||'application/octet-stream',bytes:item.file.size,type:typeFor(item.file)})});if(init.result.deduplicated){item.progress=100;item.status='dùng lại media';renderPending();return}const s=init.result.session;const parts=[];for(let part=1;part<=s.totalParts;part++){item.status=`upload ${part}/${s.totalParts}`;renderPending();const start=(part-1)*s.partSize,end=Math.min(item.file.size,start+s.partSize);const signed=await api(`/api/lms/admin?endpoint=v5-upload&course=${encodeURIComponent(state.courseSlug)}`,{method:'POST',body:JSON.stringify({action:'partUrl',course:state.courseSlug,sessionId:s.id,partNumber:part})});const response=await fetch(signed.result.url,{method:'PUT',body:item.file.slice(start,end)});if(!response.ok)throw new Error(`R2 part ${part} lỗi HTTP ${response.status}`);const etag=response.headers.get('etag');if(!etag)throw new Error('R2 CORS chưa expose ETag.');parts.push({partNumber:part,etag});item.progress=Math.round(end/item.file.size*100);renderPending()}item.status='xác minh';renderPending();await api(`/api/lms/admin?endpoint=v5-upload&course=${encodeURIComponent(state.courseSlug)}`,{method:'POST',body:JSON.stringify({action:'complete',course:state.courseSlug,sessionId:s.id,parts})});item.progress=100;item.status='READY';renderPending()}
async function send(){const text=$('composerInput').value.trim();if(!state.activeLessonId)return toast('Hãy tạo/chọn một Bài học trước.');const files=[...state.files];try{const created=await action('createPost',{lessonId:state.activeLessonId,textContent:text,hasAttachments:files.length>0});const postId=created.result.id;$('composerInput').value='';autoGrow();if(files.length){state.files=files;for(let i=0;i<files.length;i++)await uploadFile(files[i],postId,i);state.files=[];renderPending();await refresh()}toast('Đã gửi nội dung vào khóa học.')}catch(e){toast(e.code==='r2_not_configured'?'R2 chưa được cấu hình trên deployment này. Nội dung text vẫn an toàn trên V5.':e.message)}finally{updateSend()}}
function openEdit(id){const p=state.data?.posts?.find(x=>x.id===id);if(!p)return;state.editingPostId=id;$('editTextInput').value=p.text_content||'';$('editModal').classList.add('show')}function closeModal(id){$(id).classList.remove('show')}
$('courseSelect').onchange=e=>chooseCourse(e.target.value);$('composerInput').oninput=()=>{autoGrow();updateSend()};$('composerInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('sendBtn').onclick=send;$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{state.files.push(...[...e.target.files].map(file=>({file,progress:0,status:'chờ gửi'})));e.target.value='';renderPending();updateSend()};$('newLessonBtn').onclick=()=>{$('lessonTitleInput').value='';$('lessonModal').classList.add('show')};$('confirmLessonBtn').onclick=async()=>{const title=$('lessonTitleInput').value.trim();if(!title)return;const d=await action('createLesson',{title});state.activeLessonId=d.result.id;closeModal('lessonModal');render()};$('savePostBtn').onclick=async()=>{await action('updatePost',{postId:state.editingPostId,textContent:$('editTextInput').value});closeModal('editModal')};$('deletePostBtn').onclick=async()=>{if(confirm('Xóa Post này?')){await action('deletePost',{postId:state.editingPostId});closeModal('editModal')}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$('previewBtn').onclick=()=>state.courseSlug&&window.open(`/v5.html?course=${encodeURIComponent(state.courseSlug)}`,'_blank');$('publishBtn').onclick=()=>toast('Publish/Release sẽ được bật sau khi preflight media + security hoàn tất.');loadCourses();
</script></body></html>
