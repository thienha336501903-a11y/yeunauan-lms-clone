<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kênh bài học</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#dbe7ef;color:#223642;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#5682a3;color:#fff;box-shadow:0 2px 10px #27475b33}.topin{max-width:760px;margin:auto;padding:10px 10px 11px;display:flex;align-items:center;gap:10px}.back{width:36px;height:36px;border:0;border-radius:50%;background:#ffffff1f;color:#fff;font-size:22px;line-height:1;cursor:pointer}.headmeta{min-width:0;flex:1}.title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10.5px;opacity:.82;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed{max-width:760px;margin:auto;padding:6px 8px calc(34px + env(safe-area-inset-bottom))}.post{background:#fff;border-radius:12px 12px 12px 4px;margin:5px 0;padding:9px 10px;box-shadow:0 1px 3px #1d374720}.post.pinned{box-shadow:inset 3px 0 #5682a3,0 1px 3px #1d374720}.meta{font-size:9.5px;color:#8997a0;display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:3px}.pin{margin-right:auto;color:#5682a3;font-weight:750}.copy{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.copy a{color:#28709b;text-decoration:none}.copy a:hover{text-decoration:underline}.media{margin-top:7px;border-radius:9px;overflow:hidden;background:#eef3f6}.media img,.media video{display:block;width:100%;max-height:74vh;object-fit:contain;background:#15212a}.doc{display:block;padding:12px;text-decoration:none;color:#315d78;font-weight:700;font-size:12px}.need{padding:12px;font-size:12px;line-height:1.5;background:#fff6e8;color:#76551f;border:1px solid #edd39d;border-radius:9px;margin-top:7px}.state{max-width:560px;margin:70px auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 30px #294a5f1d}.spin{width:34px;height:34px;border:3px solid #dce7ed;border-top-color:#5682a3;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:10px;background:#5682a3;color:#fff;text-decoration:none;font-size:12px;font-weight:750}.small{font-size:11px;color:#7c8c96;line-height:1.5;margin-top:6px}.empty{background:#fff;border-radius:12px;padding:22px;text-align:center;color:#71818d;font-size:13px;margin-top:10px}@media(max-width:520px){.feed{padding-left:5px;padding-right:5px}.post{border-radius:10px 10px 10px 3px;margin:4px 0;padding:9px}.copy{font-size:13.5px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><button class="back" id="backBtn" type="button" aria-label="Quay lại">‹</button><div class="headmeta"><div class="title" id="title">Kênh bài học</div><div class="sub" id="sub">Đang tải nội dung…</div></div></div></header>
<div class="state" id="state"><div class="card" id="stateCard"><div class="spin"></div>Đang tải kênh bài học…</div></div>
<main class="feed" id="feed" hidden></main>
<script>
(()=>{
const q=new URLSearchParams(location.search),course=String(q.get('course')||'').trim(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function headers(){try{const sid=localStorage.getItem('lms_verified_session_id')||localStorage.getItem('lms_session_id')||'',did=localStorage.getItem('lms_device_id')||'';return sid&&did?{'X-LMS-Session-Id':sid,'X-LMS-Device-Id':did}:{}}catch{return {}}}
function fmtSize(n){n=Number(n||0);if(!n)return '';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function fmtDate(v){try{return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return ''}}
function state(html){$('state').hidden=false;$('stateCard').innerHTML=html;$('feed').hidden=true}
function linkify(text){const safe=esc(text);return safe.replace(/(https?:\/\/[^\s<]+)/gi,m=>{const clean=m.replace(/[.,;:!?]+$/,'');const suffix=m.slice(clean.length);return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${suffix}`})}
function mediaHtml(post){const m=post.media;if(!m)return '';const playable=['telegram_gateway_bot','telegram_gateway_mtproto'].includes(m.delivery)&&m.url;if(!playable)return `<div class="need">Media của bài này hiện chưa phát được. Vui lòng thử lại sau.</div>`;if(m.type==='photo')return `<div class="media"><img loading="lazy" src="${esc(m.url)}" alt="Ảnh bài học"></div>`;if(['video','animation','video_note'].includes(m.type))return `<div class="media"><video controls preload="metadata" playsinline src="${esc(m.url)}"></video></div>`;return `<div class="media"><a class="doc" href="${esc(m.url)}" target="_blank" rel="noopener">Mở ${esc(m.name||m.type||'tệp')}${m.size?' · '+esc(fmtSize(m.size)):''}</a></div>`}
function render(d){$('state').hidden=true;$('feed').hidden=false;const source=String(d.source?.title||d.source?.username||'Kênh bài học');document.title=source;$('title').textContent=source;$('sub').textContent=[d.course,d.email,`${d.stats?.total||0} bài`].filter(Boolean).join(' · ');const posts=Array.isArray(d.posts)?d.posts:[];$('feed').innerHTML=posts.map(p=>`<article class="post${p.isPinned?' pinned':''}"><div class="meta">${p.isPinned?'<span class="pin">📌 Đã ghim</span>':''}<span>${esc(fmtDate(p.date))}</span></div>${p.text?`<div class="copy">${linkify(p.text)}</div>`:''}${mediaHtml(p)}</article>`).join('')||'<div class="empty">Kênh chưa có bài học nào.</div>'}
async function init(){if(!course){state('Thiếu mã khóa học.<br><a class="btn" href="/learning">Về danh sách khóa học</a>');return}try{const r=await fetch('/api/lms/portal?endpoint=v4-telegram-feed&course='+encodeURIComponent(course),{credentials:'same-origin',headers:headers(),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.ok&&d.success){render(d);return}if(r.status===401){location.replace('/learning?course='+encodeURIComponent(course));return}if(d.code==='v4_source_not_enabled'||d.code==='telegram_source_missing'){location.replace('/channel-candidate.html?course='+encodeURIComponent(course));return}if(r.status===403){state('<b>Không có quyền truy cập khóa học này.</b><div class="small">'+esc(d.error||'Vui lòng đăng nhập đúng tài khoản học viên.')+'</div><a class="btn" href="/learning">Về danh sách khóa học</a>');return}state('<b>Không tải được kênh bài học</b><div class="small">'+esc(d.error||('HTTP '+r.status))+'</div><button class="btn" onclick="location.reload()">Thử lại</button>')}catch(e){state('<b>Lỗi kết nối</b><div class="small">'+esc(e.message||e)+'</div><button class="btn" onclick="location.reload()">Thử lại</button>')}}
$('backBtn').addEventListener('click',()=>{location.href='/learning'});init();
})();
</script>
</body>
</html>
