function fmtSize(n){n=Number(n||0);if(!n)return '';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function validDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:new Date()}function dateKey(v){const d=validDate(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dateLabel(v){try{return new Intl.DateTimeFormat('vi-VN',{day:'numeric',month:'long'}).format(validDate(v))}catch{return ''}}function timeLabel(v){try{return new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(validDate(v))}catch{return ''}}
function linkify(text){const safe=esc(text);return safe.replace(/(https?:\/\/[^\s<]+)/gi,m=>{const clean=m.replace(/[.,;:!?]+$/,'');const suffix=m.slice(clean.length);return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${suffix}`})}function state(html){$('state').hidden=false;$('stateCard').innerHTML=html;$('app').hidden=true}function normalize(v){return String(v||'').trim().toLowerCase()}function sameSecond(a,b){return Math.floor(validDate(a).getTime()/1000)===Math.floor(validDate(b).getTime()/1000)}
function isRecipeText(text){const t=normalize(text);return !t.startsWith('video')&&(t.includes('gr ')||t.includes('nguyên liệu')||t.includes('công thức')||t.includes('ml ')||t.includes('kg '))}function mediaCategory(posts){if(posts.some(p=>VIDEO_TYPES.has(p.media?.type||p.type)))return 'video';if(posts.some(p=>FILE_TYPES.has(p.media?.type||p.type)))return 'file';if(posts.some(p=>(p.media?.type||p.type)==='photo'))return 'photo';return 'all'}
function buildLessons(posts){const out=[];for(let i=0;i<posts.length;i++){const p=posts[i];if(p.media){const group=[p],gid=String(p.mediaGroupId||'');while(i+1<posts.length){const n=posts[i+1],grouped=gid?String(n.mediaGroupId||'')===gid:Boolean(n.media)&&sameSecond(p.date,n.date)&&!n.isPinned;if(!grouped)break;group.push(n);i++}const titlePost=group.find(x=>String(x.text||'').trim()),title=String(titlePost?.text||'').trim()||(mediaCategory(group)==='video'?'Video bài học':mediaCategory(group)==='file'?'Tài liệu bài học':'Hình ảnh bài học'),cat=mediaCategory(group);out.push({id:`lesson-${group[0].telegramMessageId||group[0].id}`,date:group[0].date,title,category:cat,isPinned:group.some(x=>x.isPinned),posts:group,search:[title,...group.map(x=>x.text||'')].join(' ').toLowerCase()});continue}const text=String(p.text||'').trim();out.push({id:`lesson-${p.telegramMessageId||p.id}`,date:p.date,title:text.split('\n')[0]||'Bài học',category:isRecipeText(text)?'recipe':'all',isPinned:Boolean(p.isPinned),posts:[p],search:text.toLowerCase()})}return out}
function loadProgress(){try{const p=JSON.parse(localStorage.getItem(progressKey)||'{}');seen=new Set(Array.isArray(p.seen)?p.seen:[]);lastSeen=String(p.last||'')}catch{seen=new Set();lastSeen=''}}function saveProgress(){try{localStorage.setItem(progressKey,JSON.stringify({seen:[...seen],last:lastSeen,updatedAt:new Date().toISOString()}))}catch{}}
function markSeen(id){if(!id)return;const fresh=!seen.has(id);seen.add(id);lastSeen=id;saveProgress();if(fresh)updateProgressUI();document.querySelectorAll(`[data-lesson-id="${CSS.escape(id)}"]`).forEach(el=>el.classList.add('seen'))}function getResumeLesson(){return lessons.find(x=>x.id===lastSeen)||lessons.find(x=>!seen.has(x.id))||lessons[0]||null}
function updateProgressUI(){const total=Math.max(lessons.length,1),pct=Math.round((seen.size/total)*100);$('progressPct').textContent=`${pct}%`;$('progressFill').style.width=`${pct}%`;$('mobileProgress').style.width=`${pct}%`;$('outlineSeen').textContent=`${seen.size} đã xem`;const resume=getResumeLesson();if(resume){$('resumeSideTitle').textContent=resume.title;$('resumeSideLabel').textContent=seen.has(resume.id)?'Xem lại bài gần nhất':'Tiếp tục học';$('resumeFloatText').textContent=resume.title.length>30?resume.title.slice(0,30)+'…':resume.title}document.querySelectorAll('.outline-item').forEach(el=>el.classList.toggle('seen',seen.has(el.dataset.lessonId)));document.querySelectorAll('.lesson-card').forEach(el=>{const check=el.querySelector('.seen-check');if(check)check.hidden=!seen.has(el.dataset.lessonId)})}
function scrollToLesson(id,mark=true){const el=document.getElementById(id);if(!el)return;if(mark){lastSeen=id;saveProgress()}el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');document.querySelectorAll('.outline-item').forEach(x=>x.classList.toggle('current',x.dataset.lessonId===id))}
function mediaItemHtml(item,index,total){const m=item.media;if(!m)return '';const transportPlayable=['telegram_gateway_bot','telegram_gateway_mtproto'].includes(m.delivery);if(m.type==='photo'&&transportPlayable&&m.url)return `<div class="media-cell" data-kind="photo" data-src="${esc(m.url)}"><img data-lazy-src="${esc(m.url)}" alt="Ảnh bài học"></div>`;if(VIDEO_TYPES.has(m.type)&&transportPlayable&&(m.playbackRequired||m.url)){const posterSrc=m.thumbnailUrl||m.deferredThumbnailUrl||'',poster=posterSrc?`<img data-lazy-src="${esc(posterSrc)}" alt="Ảnh xem trước video">`:`<div style="position:absolute;inset:0;display:grid;place-items:center;color:#c7d2cc;font-size:11px">Chạm để phát video</div>`;return `<div class="media-cell" data-kind="video" data-message-id="${esc(item.id||'')}">${poster}<button class="play" type="button" aria-label="Phát video">▶</button>${total>5&&index===4?`<span class="more-overlay">+${total-5}</span>`:''}</div>`}if(FILE_TYPES.has(m.type)&&transportPlayable&&m.url)return `<a class="doc" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="doc-icon">📄</span><span class="doc-copy"><span class="doc-name">${esc(m.name||'Tài liệu bài học')}</span><span class="doc-size">${esc(fmtSize(m.size))}</span></span></a>`;return `<div class="unavailable">Media của bài này hiện chưa phát được. Vui lòng thử lại sau.</div>`}
function lessonHtml(lesson){const posts=lesson.posts,mediaPosts=posts.filter(p=>p.media),textOnly=posts.length===1&&!posts[0].media?String(posts[0].text||'').trim():'',caption=mediaPosts.length?String((posts.find(p=>String(p.text||'').trim())||{}).text||'').trim():'';let media='';if(mediaPosts.length){const files=mediaPosts.filter(p=>FILE_TYPES.has(p.media?.type||p.type)),visual=mediaPosts.filter(p=>!FILE_TYPES.has(p.media?.type||p.type));if(visual.length){const cls=visual.length===1?'n1':visual.length===2?'n2':visual.length===3?'n3':visual.length===4?'n4':'n5p';media+=`<div class="media-grid ${cls}">${visual.map((p,i)=>mediaItemHtml(p,i,visual.length)).join('')}</div>`}media+=files.map((p,i)=>mediaItemHtml(p,i,files.length)).join('')}return `<article class="lesson-card" id="${esc(lesson.id)}" data-lesson-id="${esc(lesson.id)}" data-category="${esc(lesson.category)}" data-search="${esc(lesson.search)}"><div class="sender">${esc(data.source?.title||data.source?.username||'Kênh bài học')}</div>${textOnly?`<div class="lesson-text">${linkify(textOnly)}</div>`:''}${media}${caption?`<div class="caption">${linkify(caption)}</div>`:''}<div class="footer"><span class="seen-check" ${seen.has(lesson.id)?'':'hidden'}>✓✓</span><span>${esc(timeLabel(lesson.date))}</span></div></article>`}
function renderOutline(){const groups=new Map();for(const l of lessons){const k=dateKey(l.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(l)}$('outline').innerHTML=[...groups.entries()].map(([k,items])=>`<section class="date-block"><div class="date-title"><span class="date-dot"></span>${esc(dateLabel(items[0].date))}<span class="date-count">${items.length}</span></div>${items.map(l=>`<button class="outline-item${seen.has(l.id)?' seen':''}" data-lesson-id="${esc(l.id)}" type="button"><span class="outline-icon">${l.category==='video'?'▶':l.category==='recipe'?'▤':l.category==='file'?'📄':'•'}</span><span class="outline-text">${esc(l.title)}</span><span class="outline-time">${esc(timeLabel(l.date))}</span><span class="outline-seen"></span></button>`).join('')}</section>`).join('');$('outlineCount').textContent=`${lessons.length} bài học`;document.querySelectorAll('.outline-item').forEach(btn=>btn.addEventListener('click',()=>scrollToLesson(btn.dataset.lessonId)))}
function renderFeed(){const chunks=[];let lastDate='';for(const l of lessons){const dk=dateKey(l.date);if(dk!==lastDate){chunks.push(`<div class="date-chip" data-date="${esc(dk)}">${esc(dateLabel(l.date))}</div>`);lastDate=dk}chunks.push(lessonHtml(l))}$('feed').innerHTML=chunks.join('')||'<div class="empty">Kênh chưa có bài học nào.</div>'}
function applyFilter(filter=activeFilter){activeFilter=filter;document.querySelectorAll('[data-filter]').forEach(btn=>btn.classList.toggle('active',btn.dataset.filter===activeFilter));const qn=normalize(searchQuery);document.querySelectorAll('.lesson-card').forEach(el=>{const id=el.dataset.lessonId,cat=el.dataset.category,hay=el.dataset.search||'',filterOk=activeFilter==='all'||(activeFilter==='unread'?!seen.has(id):cat===activeFilter),searchOk=!qn||hay.includes(qn);el.classList.toggle('filtered',!(filterOk&&searchOk))});document.querySelectorAll('.date-chip').forEach(chip=>{let node=chip.nextElementSibling,visible=false;while(node&&!node.classList.contains('date-chip')){if(node.classList.contains('lesson-card')&&!node.classList.contains('filtered')){visible=true;break}node=node.nextElementSibling}chip.hidden=!visible})}
async function ensureMediaWorker(){if(!('serviceWorker'in navigator))throw new Error('Trình duyệt chưa hỗ trợ phát video bảo vệ');if(navigator.serviceWorker.controller)return navigator.serviceWorker.controller;if(!mediaWorkerReadyPromise){mediaWorkerReadyPromise=(async()=>{await navigator.serviceWorker.register('/v4-media-sw.js?v=1',{scope:'/'});await navigator.serviceWorker.ready;if(navigator.serviceWorker.controller)return navigator.serviceWorker.controller;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Không khởi tạo được lớp bảo vệ video')),5000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timer);resolve()},{once:true})});if(!navigator.serviceWorker.controller)throw new Error('Lớp bảo vệ video chưa sẵn sàng');return navigator.serviceWorker.controller})()}return mediaWorkerReadyPromise}
async function requestPlaybackLease(messageId){const r=await fetch('/api/lms/portal?endpoint=v4-telegram-play&course='+encodeURIComponent(course),{method:'POST',credentials:'same-origin',cache:'no-store',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:messageId})});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.success)throw new Error(d.error||('Không cấp được quyền phát video (HTTP '+r.status+')'));return d}
function sendLeaseToWorker(worker,lease){return new Promise((resolve,reject)=>{const channel=new MessageChannel(),timer=setTimeout(()=>reject(new Error('Lớp bảo vệ video không phản hồi')),2500);channel.port1.onmessage=e=>{clearTimeout(timer);e.data?.ok?resolve():reject(new Error('Không ghi được quyền phát video'))};worker.postMessage({type:'V4_MEDIA_LEASE',leaseId:lease.leaseId,token:lease.token,proof:lease.proof,gateway:lease.gateway,expiresAt:lease.expiresAt},[channel.port2])})}
function startMovingWatermark(mark){const move=()=>{mark.style.left=(5+Math.floor(Math.random()*56))+'%';mark.style.top=(7+Math.floor(Math.random()*62))+'%'};move();return setInterval(move,7000)}
async function startProtectedVideo(cell,messageId){if(cell.dataset.loading==='1')return;cell.dataset.loading='1';const btn=cell.querySelector('.play');if(btn)btn.disabled=true;const loading=document.createElement('div');loading.className='media-loading';loading.textContent='Đang cấp quyền phát an toàn…';cell.appendChild(loading);try{const worker=await ensureMediaWorker(),lease=await requestPlaybackLease(messageId);await sendLeaseToWorker(worker,lease);const lesson=cell.closest('.lesson-card');if(lesson)markSeen(lesson.dataset.lessonId);const video=document.createElement('video');video.controls=true;video.autoplay=true;video.preload='metadata';video.playsInline=true;video.setAttribute('controlsList','nodownload noremoteplayback');video.setAttribute('disableRemotePlayback','');try{video.disablePictureInPicture=true}catch{}video.addEventListener('contextmenu',e=>e.preventDefault());const mark=document.createElement('div');mark.className='media-watermark';mark.hidden=true;const markTimer=startMovingWatermark(mark);video.addEventListener('ended',()=>{clearInterval(markTimer);if(lesson)markSeen(lesson.dataset.lessonId);worker.postMessage({type:'V4_MEDIA_REVOKE',leaseId:lease.leaseId})});video.addEventListener('error',()=>{clearInterval(markTimer);mark.hidden=false;mark.textContent='Phiên phát video đã hết hạn — chạm tải lại trang để thử lại'});cell.replaceChildren(video,mark);video.src='/v4-media/'+encodeURIComponent(lease.leaseId);video.play().catch(()=>{})}catch(error){loading.textContent=error?.message||'Không phát được video';if(btn)btn.disabled=false;setTimeout(()=>{loading.remove();cell.dataset.loading=''},2200);return}cell.dataset.loading=''}
function wireMedia(){document.querySelectorAll('.media-cell[data-kind="video"]').forEach(cell=>{const btn=cell.querySelector('.play');if(!btn)return;btn.addEventListener('click',e=>{e.stopPropagation();const messageId=String(cell.dataset.messageId||'').trim();if(messageId)startProtectedVideo(cell,messageId)})});document.querySelectorAll('.media-cell[data-kind="photo"]').forEach(cell=>cell.addEventListener('click',()=>{$('lightImage').src=cell.dataset.src||'';$('lightbox').classList.add('open')}))}
function wireLazyImages(){const images=[...document.querySelectorAll('img[data-lazy-src]')],load=img=>{const src=String(img.dataset.lazySrc||'');if(!src)return;img.src=src;img.removeAttribute('data-lazy-src')};images.slice(0,2).forEach((img,i)=>{img.fetchPriority=i===0?'high':'auto';load(img)});if(images.length<=2)return;if(!('IntersectionObserver'in window)){images.slice(2).forEach(load);return}const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;load(entry.target);observer.unobserve(entry.target)}},{rootMargin:'240px 0px',threshold:.01});images.slice(2).forEach(img=>observer.observe(img))}
function wireObservers(){if(!('IntersectionObserver'in window))return;const obs=new IntersectionObserver(entries=>{for(const e of entries){const id=e.target.dataset.lessonId;if(e.isIntersecting&&e.intersectionRatio>=.45){if(observeTimers.has(id))continue;const t=setTimeout(()=>{markSeen(id);observeTimers.delete(id)},900);observeTimers.set(id,t)}else if(observeTimers.has(id)){clearTimeout(observeTimers.get(id));observeTimers.delete(id)}}},{threshold:[0,.45,.7]});document.querySelectorAll('.lesson-card').forEach(el=>obs.observe(el))}
function render(d){data=d;loadProgress();lessons=buildLessons(Array.isArray(d.posts)?d.posts:[]);const source=String(d.source?.title||d.source?.username||'Kênh bài học');document.title=source;$('sideTitle').textContent=source;$('mobileTitle').textContent=source;const sub=`${lessons.length} bài học · ${d.course||''}`;$('sideSub').textContent=sub;$('mobileSub').textContent=sub;renderOutline();renderFeed();const lead=lessons.find(x=>x.isPinned)||lessons[0];if(lead){$('pinLabel').textContent=lead.isPinned?'Bài học được ghim':'Bắt đầu khóa học';$('pinTitle').textContent=lead.title;$('pinAction').onclick=()=>scrollToLesson(lead.id)}else $('pinStrip').hidden=true;wireLazyImages();wireMedia();wireObservers();updateProgressUI();applyFilter();$('state').hidden=true;$('app').hidden=false;ensureMediaWorker().catch(()=>{})}
function warmMtprotoInBackground(){const url='/api/lms/portal?endpoint=v4-telegram-warmup&course='+encodeURIComponent(course);setTimeout(()=>{fetch(url,{method:'POST',credentials:'same-origin',headers:headers(),cache:'no-store',keepalive:true}).catch(()=>{})},0)}
async function init(){if(!course){state('Thiếu mã khóa học.<br><a class="btn" href="/learning">Về danh sách khóa học</a>');return}warmMtprotoInBackground();try{const r=await fetch('/api/lms/portal?endpoint=v4-telegram-feed&course='+encodeURIComponent(course),{credentials:'same-origin',headers:headers(),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.ok&&d.success){render(d);return}if(r.status===401){location.replace('/v3?return=v4&course='+encodeURIComponent(course));return}if(d.code==='v4_source_not_enabled'||d.code==='telegram_source_missing'){location.replace('/channel-candidate.html?course='+encodeURIComponent(course));return}if(r.status===403){state('<b>Không có quyền truy cập khóa học này.</b><div class="small">'+esc(d.error||'Vui lòng đăng nhập đúng tài khoản học viên.')+'</div><a class="btn" href="/learning">Về danh sách khóa học</a>');return}state('<b>Không tải được kênh bài học</b><div class="small">'+esc(d.error||('HTTP '+r.status))+'</div><button class="btn" onclick="location.reload()">Thử lại</button>')}catch(e){state('<b>Lỗi kết nối</b><div class="small">'+esc(e.message||e)+'</div><button class="btn" onclick="location.reload()">Thử lại</button>')}}
function bind(){$('sideBack').onclick=$('mobileBack').onclick=()=>location.href='/learning';document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>applyFilter(btn.dataset.filter)));$('searchInput').addEventListener('input',e=>{searchQuery=e.target.value;$('mobileSearchInput').value=searchQuery;applyFilter()});$('mobileSearchInput').addEventListener('input',e=>{searchQuery=e.target.value;$('searchInput').value=searchQuery;applyFilter()});$('mobileSearchBtn').onclick=()=>{$('mobileSearch').classList.toggle('show');if($('mobileSearch').classList.contains('show'))setTimeout(()=>$('mobileSearchInput').focus(),50)};const resume=()=>{const l=getResumeLesson();if(l)scrollToLesson(l.id,false)};$('resumeSide').onclick=resume;$('resumeFloat').onclick=resume;$('lightClose').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('open')})}
bind();init();
})();
