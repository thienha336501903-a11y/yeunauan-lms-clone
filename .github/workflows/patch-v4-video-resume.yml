name: Apply V4 unfinished-video resume fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v4-resume-video-progress-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply unfinished-video resume fix
        run: node scripts/patch-v4-video-resume.mjs
      - name: Validate
        run: npm test
      - name: Commit functional changes and remove one-time tooling
        run: |
          rm -f scripts/patch-v4-video-resume.mjs .github/workflows/patch-v4-video-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resume the latest unfinished V4 video"
          git push origin HEAD:${{ github.head_ref }}
