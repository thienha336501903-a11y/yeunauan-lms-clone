name: System B temporary restore drill

on:
  workflow_dispatch:
    inputs:
      backup_key:
        description: R2 key under system-b/daily or system-b/weekly ending in .dump.gpg
        required: true
        type: string
      confirmation:
        description: Type RESTORE_TO_TEMP_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system-b-temporary-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.repository == 'thienha336501903-a11y/yeunauan-lms-clone' &&
      inputs.confirmation == 'RESTORE_TO_TEMP_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYSTEM_B_BACKUP_KEY: ${{ inputs.backup_key }}
      SYSTEM_B_BACKUP_DATABASE_URL: ${{ secrets.SYSTEM_B_BACKUP_DATABASE_URL }}
      SYSTEM_B_BACKUP_GPG_PRIVATE_KEY_B64: ${{ secrets.SYSTEM_B_BACKUP_GPG_PRIVATE_KEY_B64 }}
      SYSTEM_B_TEMP_RESTORE_DATABASE_URL: ${{ secrets.SYSTEM_B_TEMP_RESTORE_DATABASE_URL }}
      SYSTEM_B_TEMP_RESTORE_CONFIRMATION: ${{ secrets.SYSTEM_B_TEMP_RESTORE_CONFIRMATION }}
      R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install PostgreSQL 17 restore dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${arch}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"
          command -v aws
          aws --version
          pg_restore --version
          psql --version
          [[ "$(pg_restore --version)" == "pg_restore (PostgreSQL) 17."* ]]
          [[ "$(psql --version)" == "psql (PostgreSQL) 17."* ]]
          command -v gpg
          command -v node
      - name: Preflight required restore-drill secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SYSTEM_B_BACKUP_GPG_PRIVATE_KEY_B64
            SYSTEM_B_TEMP_RESTORE_DATABASE_URL
            SYSTEM_B_TEMP_RESTORE_CONFIRMATION
            R2_BACKUP_ACCOUNT_ID
            R2_BACKUP_ACCESS_KEY_ID
            R2_BACKUP_SECRET_ACCESS_KEY
            R2_BACKUP_BUCKET
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required restore-drill secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "Required restore-drill secrets are configured."
      - name: Restore only to the guarded temporary target
        run: bash scripts/system-b-restore-drill.sh
