name: Ops deploy V5 Worker once

on:
  push:
    branches:
      - ops/deploy-v5-worker-v2-only-20260910
    paths:
      - .github/workflows/ops-deploy-v5-worker-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3679a2268ea2ab5109b744d03b0f12311c242f68"
          grep -q 'url.pathname === "/v1/media"' cloudflare/v5-media-worker/src/index.js && { echo 'V1 route still present'; exit 1; } || true
          grep -q 'url.pathname === "/v2/media"' cloudflare/v5-media-worker/src/index.js
      - name: Prepare production Wrangler config without overwriting dashboard vars
        shell: bash
        run: |
          cat > cloudflare/v5-media-worker/wrangler.deploy.toml <<'EOF'
          name = "yeubep-v5-media"
          main = "src/index.js"
          compatibility_date = "2026-08-01"

          [[r2_buckets]]
          binding = "V5_MEDIA"
          bucket_name = "yeubep-v5-media-prod"

          [[ratelimits]]
          name = "V5_MEDIA_RATE_LIMITER"
          namespace_id = "1001"
            [ratelimits.simple]
            limit = 600
            period = 60

          [[durable_objects.bindings]]
          name = "V5_PLAYBACK_NONCES"
          class_name = "V5PlaybackNonceGuard"

          [[migrations]]
          tag = "v5-playback-v2-nonces"
          new_sqlite_classes = ["V5PlaybackNonceGuard"]
          EOF
      - name: Verify Cloudflare auth is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && { [ -z "${CLOUDFLARE_API_KEY:-}" ] || [ -z "${CLOUDFLARE_EMAIL:-}" ]; }; then
            echo '::error::No Cloudflare credential is configured in GitHub Actions secrets.'
            exit 2
          fi
      - name: Wrangler dry run
        run: npx --yes wrangler@4.129.1 deploy --config cloudflare/v5-media-worker/wrangler.deploy.toml --dry-run --keep-vars
      - name: Deploy V2-only Worker
        run: npx --yes wrangler@4.129.1 deploy --config cloudflare/v5-media-worker/wrangler.deploy.toml --keep-vars
