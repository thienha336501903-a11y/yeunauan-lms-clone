name: Patch Student Manager Links

on:
  push:
    branches:
      - agent/student-course-manager
    paths:
      - .github/workflows/patch-student-manager-links.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/student-course-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch V4 entry manager links and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v4-entry.html')
          s = p.read_text()
          s2 = s.replace('href="/"', 'href="/my-courses.html"')
          if s2 == s:
              raise SystemExit('No V4 entry manager links patched')
          p.write_text(s2)
          PY
          node --check utils/lms-handlers/student-dashboard.js
          node --check api/lms/portal.js
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['my-courses.html','v4-entry.html']){
            const html=fs.readFileSync(file,'utf8');
            for(const [,src] of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new Function(src);
          }
          NODE
          npm ci
          npm test
          git diff --check
          grep -q '/my-courses.html' v4-entry.html
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-student-manager-links.yml
          git add v4-entry.html
          git commit -m "fix: route V4 back links to course manager"
          git push origin HEAD:agent/student-course-manager
