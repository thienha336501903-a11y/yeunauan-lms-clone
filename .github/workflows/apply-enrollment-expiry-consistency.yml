name: Apply enrollment expiry consistency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/enrollment-expiry-consistency-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrollment-expiry-consistency-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply expiry consistency patch
        run: node scripts/apply-enrollment-expiry-consistency.mjs
      - name: Validate
        run: |
          npm test
          node --check utils/lms-enrollment-status.js
          node --check utils/lms-handlers/course-data.js
          node --check utils/lms-handlers/v3-bootstrap.js
          node --check utils/lms-handlers/student-dashboard.js
          node --check utils/v4-telegram-access.js
          node --check utils/lms-handlers/admin-v4-enrollments.js
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/lms-handlers/course-data.js utils/lms-handlers/v3-bootstrap.js utils/lms-handlers/student-dashboard.js utils/v4-telegram-access.js utils/lms-handlers/admin-v4-enrollments.js
          git commit -m "fix: enforce enrollment expiry consistently"
      - name: Remove one-time tooling
        run: |
          rm -f scripts/apply-enrollment-expiry-consistency.mjs .github/workflows/apply-enrollment-expiry-consistency.yml
          git add -A
          git commit -m "chore: remove enrollment expiry patch tooling"
      - name: Push
        run: git push origin HEAD:fix/enrollment-expiry-consistency-20260820
