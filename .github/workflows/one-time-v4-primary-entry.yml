name: Apply V4 primary Wizard navigation

on:
  push:
    branches:
      - feat/v4-primary-wizard-entry-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-primary-wizard-entry-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply exact Admin/Wizard patch
        run: node scripts/patch-v4-primary-entry.mjs
      - name: Run regression tests
        run: npm test
      - name: Remove one-time patch tooling
        run: rm scripts/patch-v4-primary-entry.mjs .github/workflows/one-time-v4-primary-entry.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: make V4 Wizard the primary admin entry"
          git push origin HEAD:feat/v4-primary-wizard-entry-20260821
