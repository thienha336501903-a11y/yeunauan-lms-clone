name: Apply V4 student expiry UX

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-v4-student-expiry-ux.mjs'
      - 'test/v4-student-expiry-ux.test.js'
      - '.github/workflows/apply-v4-student-expiry-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/v4-student-expiry-ux-20260820'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-student-expiry-ux-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply expiry UX patch
        run: node scripts/apply-v4-student-expiry-ux.mjs
      - name: Validate
        run: |
          npm test
          node --check scripts/apply-v4-student-expiry-ux.mjs
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my-courses.html test/v4-student-expiry-ux.test.js
          git commit -m 'feat: show expired V4 access clearly' || true
      - name: Remove one-time tooling
        run: |
          git rm scripts/apply-v4-student-expiry-ux.mjs .github/workflows/apply-v4-student-expiry-ux.yml
          git commit -m 'chore: remove V4 expiry UX tooling'
      - name: Push
        run: git push origin HEAD:feat/v4-student-expiry-ux-20260820
