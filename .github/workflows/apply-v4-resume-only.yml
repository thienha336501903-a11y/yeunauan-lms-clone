name: Apply V4 resume-only cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v4-resume-only-remove-dots-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove dots and keep resume fix
        run: node scripts/patch-v4-remove-options.mjs
      - name: Validate
        run: npm test
      - name: Commit functional changes and remove one-time tooling
        run: |
          rm -f scripts/patch-v4-remove-options.mjs .github/workflows/apply-v4-resume-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep V4 resume only and remove dots"
          git push origin HEAD:${{ github.head_ref }}
