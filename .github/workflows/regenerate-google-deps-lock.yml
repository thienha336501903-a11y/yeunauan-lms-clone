name: Regenerate Google deps lock (temporary)

on:
  push:
    branches:
      - chore/upgrade-google-client-deps-20260831
    paths:
      - .github/workflows/regenerate-google-deps-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upgrade-google-client-deps-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock to branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Google dependency lockfile"
          git push origin HEAD:chore/upgrade-google-client-deps-20260831
