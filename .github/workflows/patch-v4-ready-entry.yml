name: Patch V4 Ready Entry

on:
  push:
    branches:
      - agent/v4-ready-gate
    paths:
      - .github/workflows/patch-v4-ready-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-ready-gate
          fetch-depth: 0
      - name: Patch V4 entry ready-state UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v4-entry.html')
          s=p.read_text()
          old="""if(r.ok&&d.success)return {mode:'v4'};if(d.code==='v4_source_not_enabled'||d.code==='telegram_source_missing')return {mode:'v3'};if(r.status===401)return {mode:'login'};return {mode:'error',error:d.error||('HTTP '+r.status)}"""
          new="""if(r.ok&&d.success)return {mode:'v4'};if(d.code==='course_not_ready')return {mode:'not_ready',error:d.error||'Khóa học chưa ở trạng thái Sẵn sàng.'};if(d.code==='v4_source_not_enabled'||d.code==='telegram_source_missing')return {mode:'v3'};if(r.status===401)return {mode:'login'};return {mode:'error',error:d.error||('HTTP '+r.status)}"""
          if old not in s:
              raise SystemExit('resolveDelivery block not found')
          s=s.replace(old,new,1)
          old2="""if(delivery.mode==='v4'){location.replace('/v4.html?course='+encodeURIComponent(active));return}if(delivery.mode==='v3'){location.replace('/channel-candidate.html?course='+encodeURIComponent(active));return}if(delivery.mode==='login'){clear();showLogin('Phiên học viên đã hết hạn. Hãy chọn lại đúng tài khoản học viên.');return}status.innerHTML='<div class=\"error\">Không xác định được nguồn bài học: '+esc(delivery.error||'Lỗi hệ thống')+'</div><button class=\"retry\" onclick=\"location.reload()\">Thử lại</button><a class=\"fallback\" href=\"/channel-candidate.html?course='+encodeURIComponent(active)+'\">Mở bản V3 dự phòng</a>';return"""
          new2="""if(delivery.mode==='v4'){location.replace('/v4.html?course='+encodeURIComponent(active));return}if(delivery.mode==='v3'){location.replace('/channel-candidate.html?course='+encodeURIComponent(active));return}if(delivery.mode==='not_ready'){status.innerHTML='<div class=\"notice\">Khóa học đã được cấp quyền nhưng nội dung chưa ở trạng thái <b>Sẵn sàng</b>. Vui lòng quay lại Quản lý khóa học và mở lại khi trạng thái chuyển sang Sẵn sàng.</div><a class=\"course\" href=\"/\"><span class=\"avatar\">↩</span><span class=\"meta\"><span class=\"name\">Quay lại Quản lý khóa học</span><span class=\"slug\">Kiểm tra trạng thái khóa học</span></span><span>›</span></a>';return}if(delivery.mode==='login'){clear();showLogin('Phiên học viên đã hết hạn. Hãy chọn lại đúng tài khoản học viên.');return}status.innerHTML='<div class=\"error\">Không xác định được nguồn bài học: '+esc(delivery.error||'Lỗi hệ thống')+'</div><button class=\"retry\" onclick=\"location.reload()\">Thử lại</button><a class=\"fallback\" href=\"/channel-candidate.html?course='+encodeURIComponent(active)+'\">Mở bản V3 dự phòng</a>';return"""
          if old2 not in s:
              raise SystemExit('openCourse delivery block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          cat > test/v4-ready-gate.test.js <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('V4 access requires course is_published', () => {
            const src = fs.readFileSync(new URL('../utils/v4-telegram-access.js', import.meta.url), 'utf8');
            assert.match(src, /select\("is_published"\)/);
            assert.match(src, /course_not_ready/);
            assert.match(src, /!course\?\.is_published/);
          });

          test('V4 entry handles course_not_ready without opening player', () => {
            const html = fs.readFileSync(new URL('../v4-entry.html', import.meta.url), 'utf8');
            assert.match(html, /course_not_ready/);
            assert.match(html, /mode:'not_ready'/);
            assert.match(html, /Quay lại Quản lý khóa học/);
          });
          JS
          node --test test/v4-ready-gate.test.js test/v4-stream-protection.test.js test/v4-telegram-warmup.test.js
          node --check utils/v4-telegram-access.js
          git diff --check
      - name: Commit runtime patch and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-v4-ready-entry.yml
          git add v4-entry.html test/v4-ready-gate.test.js
          git commit -m "fix: gate V4 entry on course ready state"
          git push origin HEAD:agent/v4-ready-gate
