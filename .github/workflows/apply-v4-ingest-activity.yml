name: Apply V4 ingest activity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/v4-ingest-activity-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-ingest-activity-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply ingest activity patch
        run: node scripts/apply-v4-ingest-activity.mjs
      - name: Validate
        run: |
          npm test
          node --check utils/lms-handlers/admin-v4-source.js
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/lms-handlers/admin-v4-source.js v4-admin.html test/v4-source-admin.test.js
          git commit -m "feat: show V4 Telegram ingest activity"
      - name: Remove one-time patch tooling
        run: |
          rm -f scripts/apply-v4-ingest-activity.mjs .github/workflows/apply-v4-ingest-activity.yml
          git add -A
          git commit -m "chore: remove V4 ingest activity patch tooling"
      - name: Push
        run: git push origin HEAD:feat/v4-ingest-activity-20260819
