name: Apply media V1 parity patch

on:
  push:
    branches:
      - fix/media-v1-parity
    paths:
      - .github/workflows/media-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-v1-parity
          fetch-depth: 0

      - name: Apply and validate patch
        run: |
          python3 .github/scripts/media_patch.py
          node --check /tmp/lesson-inline.js
          git diff --check

      - name: Commit final media patch
        run: |
          rm -f .github/workflows/media-patch.yml .github/scripts/media_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson.html .github/workflows/media-patch.yml .github/scripts/media_patch.py
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: align V1 media playback and captions"
          git push origin HEAD:fix/media-v1-parity
