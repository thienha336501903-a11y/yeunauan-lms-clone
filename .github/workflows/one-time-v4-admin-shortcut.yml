name: One-time V4 admin shortcut

on:
  push:
    branches:
      - feat/v4-admin-shortcut-20260819

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-admin-shortcut-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shortcut patch
        run: node scripts/patch-v4-admin-shortcut.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          node --check utils/lms-handlers/admin-v4-source.js
          npm test
      - name: Commit final branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add V4 admin shortcut and course creation"
          git push origin HEAD:feat/v4-admin-shortcut-20260819
