name: Patch V4 Mobile Appendix

on:
  push:
    branches:
      - agent/v4-stream-protection
    paths:
      - .github/workflows/patch-v4-mobile-appendix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-stream-protection
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add mobile appendix drawer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v4.html')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              count = s.count(old)
              assert count == 1, f'{label}: expected 1 match, got {count}'
              s = s.replace(old, new, 1)

          once(
              '.mobile-filters{display:none}.mobile-progress{display:none}',
              '.mobile-filters{display:none}.mobile-outline-backdrop,.mobile-outline-sheet{display:none}.mobile-progress{display:none}',
              'mobile drawer default visibility'
          )
          once(
              'grid-template-columns:repeat(4,1fr);gap:7px',
              'grid-template-columns:repeat(5,1fr);gap:5px',
              'mobile five-column nav'
          )
          once(
              '.mobile-filter.active{background:var(--tg-green);color:#fff;font-weight:750}.lightbox{padding:12px}}',
              '.mobile-filter.active{background:var(--tg-green);color:#fff;font-weight:750}.mobile-outline-btn.open{background:var(--tg-green);color:#fff;font-weight:750}.mobile-outline-backdrop{display:block;position:fixed;inset:0;z-index:58;background:rgba(14,25,19,.42);opacity:0;pointer-events:none;transition:opacity .2s ease}.mobile-outline-backdrop.open{opacity:1;pointer-events:auto}.mobile-outline-sheet{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:59;max-height:min(72vh,620px);flex-direction:column;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(27,51,36,.22);transform:translateY(105%);transition:transform .22s ease;padding-bottom:max(10px,env(safe-area-inset-bottom))}.mobile-outline-sheet.open{transform:translateY(0)}.mobile-outline-grab{width:42px;height:4px;border-radius:999px;background:#d5ddd7;margin:8px auto 4px}.mobile-outline-head{display:flex;align-items:center;gap:10px;padding:8px 15px 10px;border-bottom:1px solid #e7ece8}.mobile-outline-headcopy{min-width:0;flex:1}.mobile-outline-headcopy strong{display:block;font-size:15px}.mobile-outline-headcopy span{display:block;margin-top:2px;font-size:11px;color:#8a9791}.mobile-outline-close{width:36px;height:36px;border:0;border-radius:50%;background:#f1f5f2;font-size:22px;cursor:pointer}.mobile-outline-scroll{overflow:auto;overscroll-behavior:contain;padding:10px 12px 16px}.mobile-outline-scroll .date-block{margin-bottom:8px}.mobile-outline-scroll .outline-item{padding:12px 11px}.mobile-outline-scroll .outline-text{font-size:12px}.lightbox{padding:12px}}',
              'mobile drawer css'
          )

          old_nav = '<nav class="mobile-filters" id="mobileFilters" aria-label="Bộ lọc bài học"><button class="mobile-filter active" data-filter="all">☷ Tất cả</button><button class="mobile-filter" data-filter="video">▷ Video</button><button class="mobile-filter" data-filter="recipe">▤ Công thức</button><button class="mobile-filter" data-filter="file">⌕ Tài liệu</button></nav>'
          new_nav = old_nav[:-6] + '<button class="mobile-filter mobile-outline-btn" id="mobileOutlineBtn" type="button">☰ Phụ lục</button></nav><div class="mobile-outline-backdrop" id="mobileOutlineBackdrop" aria-hidden="true"></div><section class="mobile-outline-sheet" id="mobileOutlineSheet" role="dialog" aria-modal="true" aria-labelledby="mobileOutlineTitle" aria-hidden="true"><div class="mobile-outline-grab"></div><div class="mobile-outline-head"><div class="mobile-outline-headcopy"><strong id="mobileOutlineTitle">Phụ lục khóa học</strong><span id="mobileOutlineCount">Chọn bài để chuyển nhanh</span></div><button class="mobile-outline-close" id="mobileOutlineClose" type="button" aria-label="Đóng phụ lục">×</button></div><div class="mobile-outline-scroll"><div class="outline" id="mobileOutline"></div></div></section>'
          once(old_nav, new_nav, 'mobile nav html')

          once(
              'function renderOutline(){',
              "function openMobileOutline(){const backdrop=$('mobileOutlineBackdrop'),sheet=$('mobileOutlineSheet'),btn=$('mobileOutlineBtn');if(!backdrop||!sheet)return;$('mobileSearch').classList.remove('show');backdrop.classList.add('open');sheet.classList.add('open');btn?.classList.add('open');backdrop.setAttribute('aria-hidden','false');sheet.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeMobileOutline(){const backdrop=$('mobileOutlineBackdrop'),sheet=$('mobileOutlineSheet'),btn=$('mobileOutlineBtn');backdrop?.classList.remove('open');sheet?.classList.remove('open');btn?.classList.remove('open');backdrop?.setAttribute('aria-hidden','true');sheet?.setAttribute('aria-hidden','true');document.body.style.overflow=''}function renderOutline(){",
              'mobile drawer functions'
          )
          once(
              ";$('outlineCount').textContent=`${lessons.length} bài học`;",
              ";if($('mobileOutline'))$('mobileOutline').innerHTML=$('outline').innerHTML;$('outlineCount').textContent=`${lessons.length} bài học`;if($('mobileOutlineCount'))$('mobileOutlineCount').textContent=`${lessons.length} bài học · chọn để chuyển nhanh`;",
              'mobile outline clone'
          )
          once(
              "document.querySelectorAll('.outline-item').forEach(btn=>btn.addEventListener('click',()=>scrollToLesson(btn.dataset.lessonId)))",
              "document.querySelectorAll('.outline-item').forEach(btn=>btn.addEventListener('click',()=>{scrollToLesson(btn.dataset.lessonId);if(btn.closest('#mobileOutline'))closeMobileOutline()}))",
              'mobile outline click close'
          )
          once(
              "$('mobileSearchBtn').onclick=()=>{$('mobileSearch').classList.toggle('show');if($('mobileSearch').classList.contains('show'))setTimeout(()=>$('mobileSearchInput').focus(),50)};const resume=",
              "$('mobileSearchBtn').onclick=()=>{$('mobileSearch').classList.toggle('show');if($('mobileSearch').classList.contains('show'))setTimeout(()=>$('mobileSearchInput').focus(),50)};$('mobileOutlineBtn').onclick=openMobileOutline;$('mobileOutlineClose').onclick=closeMobileOutline;$('mobileOutlineBackdrop').onclick=closeMobileOutline;const resume=",
              'mobile drawer bindings'
          )
          once(
              "document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('open')})",
              "document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('lightbox').classList.remove('open');closeMobileOutline()}})",
              'escape closes mobile appendix'
          )

          assert 'id="mobileOutlineBtn"' in s
          assert 'id="mobileOutline"' in s
          assert 'Phụ lục khóa học' in s
          assert 'grid-template-columns:repeat(5,1fr)' in s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v4.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/v4-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/v4-inline.js
      - name: Commit mobile appendix
        run: |
          git config user.name "thienha336501903-a11y"
          git config user.email "thienha336501903@gmail.com"
          git add v4.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: add mobile V4 course appendix"
          git push origin HEAD:agent/v4-stream-protection
