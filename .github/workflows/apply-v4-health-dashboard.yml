name: Apply V4 health dashboard
on:
  push:
    branches:
      - feat/v4-health-dashboard-20260819
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply dashboard patch
        run: node scripts/apply-v4-health-dashboard.mjs
      - name: Validate
        run: npm test
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/lms-handlers/admin-v4-source.js v4-admin.html test/v4-source-admin.test.js
          git commit -m "feat: add V4 health dashboard"
      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply-v4-health-dashboard.mjs .github/workflows/apply-v4-health-dashboard.yml scripts/trigger-v4-health-dashboard.txt
          git add -A
          git commit -m "chore: remove V4 health patch tooling"
      - name: Push
        run: git push origin HEAD:feat/v4-health-dashboard-20260819
