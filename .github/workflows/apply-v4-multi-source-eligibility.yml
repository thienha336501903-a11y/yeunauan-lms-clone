name: Apply V4 multi-source eligibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v4-multi-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/v4-multi-source-eligibility-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-multi-source-eligibility-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply multi-source patch
        run: node scripts/apply-v4-multi-source-eligibility.mjs
      - name: Validate
        run: |
          npm test
          node --check utils/lms-handlers/admin-v4-source.js
          node --check utils/lms-handlers/admin-courses.js
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/lms-handlers/admin-v4-source.js utils/lms-handlers/admin-courses.js v4-admin.html test/v4-source-admin.test.js
          git commit -m "fix: decouple V4 sources from mirror master"
      - name: Remove one-time patch tooling
        run: |
          rm -f scripts/apply-v4-multi-source-eligibility.mjs .github/workflows/apply-v4-multi-source-eligibility.yml
          git add -A
          git commit -m "chore: remove V4 multi-source patch tooling"
      - name: Push
        run: git push origin HEAD:fix/v4-multi-source-eligibility-20260819
