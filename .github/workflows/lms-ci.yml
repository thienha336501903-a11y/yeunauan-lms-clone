name: LMS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Node tests
        run: npm test
      - name: Clone configuration isolation
        run: npm run check:clone
      - name: Critical syntax checks
        run: |
          node --check api/learning.js
          node --check api/lms/portal.js
          node --check api/lms/admin.js
          node --check utils/lms-handlers/student-dashboard.js
          node --check utils/lms-handlers/v4-telegram-feed.js
          node --check utils/v4-telegram-access.js
          node --check utils/lms-handlers/admin-v4-prepublish.js
          node --check utils/lms-handlers/admin-v5-content.js
          node --check utils/lms-handlers/admin-v5-upload.js
          node --check utils/lms-handlers/admin-v5-release.js
          node --check utils/lms-handlers/admin-v5-telegram-import.js
          node --check utils/lms-handlers/admin-v5-capabilities.js
          node --check utils/lms-handlers/v5-feed.js
          node --check utils/lms-handlers/v5-play.js
          node --check utils/v5-r2.js
          node --check utils/v5-playback-lease.js
          node --check v5/media-sw.js
          node --check cloudflare/v5-media-worker/src/index.js
