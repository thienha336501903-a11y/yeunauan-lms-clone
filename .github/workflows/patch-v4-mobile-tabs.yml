name: Patch V4 Mobile Tabs

on:
  push:
    branches:
      - agent/v4-stream-protection
    paths:
      - .github/workflows/patch-v4-mobile-tabs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-stream-protection
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Keep only All and Appendix on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v4.html')
          s=p.read_text(encoding='utf-8')
          old='grid-template-columns:repeat(5,1fr);gap:5px'
          new='grid-template-columns:repeat(2,1fr);gap:7px'
          assert s.count(old)==1, f'grid marker count={s.count(old)}'
          s=s.replace(old,new,1)
          old_nav='<nav class="mobile-filters" id="mobileFilters" aria-label="Bộ lọc bài học"><button class="mobile-filter active" data-filter="all">☷ Tất cả</button><button class="mobile-filter" data-filter="video">▷ Video</button><button class="mobile-filter" data-filter="recipe">▤ Công thức</button><button class="mobile-filter" data-filter="file">⌕ Tài liệu</button><button class="mobile-filter mobile-outline-btn" id="mobileOutlineBtn" type="button">☰ Phụ lục</button></nav>'
          new_nav='<nav class="mobile-filters" id="mobileFilters" aria-label="Chức năng khóa học"><button class="mobile-filter active" data-filter="all">☷ Tất cả</button><button class="mobile-filter mobile-outline-btn" id="mobileOutlineBtn" type="button">☰ Phụ lục</button></nav>'
          assert s.count(old_nav)==1, f'nav marker count={s.count(old_nav)}'
          s=s.replace(old_nav,new_nav,1)
          assert 'data-filter="video"' in s  # desktop filters remain
          assert s.count('id="mobileOutlineBtn"')==1
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v4.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/v4-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/v4-inline.js
          git diff --check
      - name: Commit mobile tabs
        run: |
          git config user.name "thienha336501903-a11y"
          git config user.email "thienha336501903@gmail.com"
          git add v4.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "ui: simplify V4 mobile tabs"
          git push origin HEAD:agent/v4-stream-protection
