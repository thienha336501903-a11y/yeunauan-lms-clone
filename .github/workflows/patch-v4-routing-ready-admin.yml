name: One-time V4 routing and Admin release patch

on:
  push:
    branches:
      - fix/v4-routing-ready-admin-20260819
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-routing-ready-admin-20260819
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose deprecated url.parse usage
        shell: bash
        run: |
          echo '--- repository source ---'
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'url\.parse' api utils . 2>/dev/null | head -50 || true
          echo '--- installed dependencies ---'
          grep -RIn 'url\.parse' node_modules 2>/dev/null | head -50 || true

      - name: Apply patch
        run: node scripts/patch-v4-routing-ready-admin.mjs

      - name: Test
        run: npm test

      - name: Critical syntax checks
        run: |
          node --check api/learning.js
          node --check api/lms/admin.js
          node --check utils/lms-handlers/admin-courses.js
          node --check utils/v4-telegram-access.js

      - name: Remove one-time patcher
        run: |
          rm -f scripts/patch-v4-routing-ready-admin.mjs
          rm -f .github/workflows/patch-v4-routing-ready-admin.yml

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: harden V4 routing and course release controls'
          git push origin HEAD:fix/v4-routing-ready-admin-20260819
