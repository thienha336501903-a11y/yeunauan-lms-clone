name: Apply V4 native resume anchor fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/v4-resume-native-anchor-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply native anchor fix
        run: node scripts/patch-v4-resume-native-anchor.mjs
      - name: Extend regression test
        run: |
          cat >> test/v4-mobile-resume-menu.test.js <<'EOF'

          test('V4 mobile resume uses a native anchor to the exact unfinished video', () => {
            assert.match(page, /<a class="resume-float" id="resumeFloat" href="#" hidden>/);
            assert.match(page, /id="resume-video-\$\{esc\(item\.id\|\|''\)\}"/);
            assert.match(page, /function updateResumeControl\(\)[\s\S]*a\.href='#'\+id/);
            assert.match(page, /scroll-margin-top:92px/);
            assert.match(page, /touch-action:manipulation/);
          });
          EOF
      - name: Validate
        run: |
          npm test
          node --check api/learning.js
      - name: Commit functional changes and remove one-time tooling
        run: |
          rm -f scripts/patch-v4-resume-native-anchor.mjs .github/workflows/patch-v4-resume-native-anchor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v4.html test/v4-mobile-resume-menu.test.js scripts/patch-v4-resume-native-anchor.mjs .github/workflows/patch-v4-resume-native-anchor.yml
          git commit -m "fix: make V4 resume a native video anchor"
          git push origin HEAD:${{ github.head_ref }}
