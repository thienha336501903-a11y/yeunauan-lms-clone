          grep -q "data-gis-retry" my-courses.html
          grep -q "Thử lại Google" my-courses.html
          grep -q "primeOAuth" my-courses.html
          git diff --check
      - name: Commit runtime patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-student-google-login.yml
          git add my-courses.html
          git commit -m "fix: retry Google Identity login on student manager"
          git push origin HEAD:fix/student-google-login-retry
