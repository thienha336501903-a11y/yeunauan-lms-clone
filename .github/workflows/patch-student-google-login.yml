name: Patch Student Google Login

on:
  push:
    branches: [fix/student-google-login-retry]
    paths: [.github/workflows/patch-student-google-login.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-google-login-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch resilient Google Identity loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('my-courses.html')
          s=p.read_text()
          old_css=".error{border:1px solid #efcaca;background:#fff0f0;color:#943b3b;border-radius:16px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px}.refresh{border:0;background:transparent;color:#356443;font-weight:850;font-size:11px;padding:5px;cursor:pointer}"
          new_css=".error{border:1px solid #efcaca;background:#fff0f0;color:#943b3b;border-radius:16px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px}.login-help{font-size:11px!important;color:#786d65!important;margin-top:12px!important}.login-help b{color:#493c34}.refresh{border:0;background:transparent;color:#356443;font-weight:850;font-size:11px;padding:5px;cursor:pointer}"
          if old_css not in s: raise SystemExit('CSS anchor missing')
          s=s.replace(old_css,new_css)
          old="""function showLogin(message=''){account.textContent='';refreshBtn.hidden=true;content.innerHTML=`<div class=\"signin\"><div class=\"icon\">🔐</div><p>${esc(message||'Đăng nhập đúng Gmail đã dùng khi đăng ký khóa học để xem trạng thái.')}</p><button id=\"googleLogin\" class=\"btn btn-google\" type=\"button\">G&nbsp; Chọn tài khoản Google</button></div>`;document.getElementById('googleLogin').addEventListener('click',chooseAccount)}
function showError(message){content.innerHTML=`<div class=\"error\">${esc(message)}</div><div class=\"signin\"><button class=\"btn btn-muted\" onclick=\"location.reload()\">Tải lại trang</button></div>`}
function waitGoogle(){return new Promise((ok,no)=>{let n=0,t=setInterval(()=>{if(window.google?.accounts?.oauth2){clearInterval(t);ok()}else if(++n>100){clearInterval(t);no(new Error('Google Identity chưa tải được'))}},100)})}
async function ensureOAuth(){if(tokenClient)return;const cfg=await fetch('/api/lms/portal?endpoint=public-config',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json());if(!cfg?.googleClientId)throw new Error('Hệ thống đăng nhập Google chưa sẵn sàng.');await waitGoogle();tokenClient=google.accounts.oauth2.initTokenClient({client_id:cfg.googleClientId,scope:'openid email profile',prompt:'select_account',callback:async resp=>{if(!resp?.access_token){showLogin('Không nhận được quyền đăng nhập Google.');return}content.innerHTML='<div class=\"loading\"><div class=\"spin\"></div>Đang tải khóa học của bạn…</div>';const {r,d}=await dashboard({accessToken:resp.access_token});if(r.ok&&d.success){render(d);return}showLogin(d.error||'Không xác thực được tài khoản học viên.')},error_callback:()=>showLogin('Không mở được cửa sổ Google. Nếu đang mở trong ứng dụng chat, hãy mở trang bằng Safari hoặc Chrome.')});}
async function chooseAccount(){try{await ensureOAuth();tokenClient.requestAccessToken({prompt:'select_account'})}catch(e){showError(e.message||String(e))}}
"""
          new="""function showLogin(message=''){account.textContent='';refreshBtn.hidden=true;content.innerHTML=`<div class=\"signin\"><div class=\"icon\">🔐</div><p>${esc(message||'Đăng nhập đúng Gmail đã dùng khi đăng ký khóa học để xem trạng thái.')}</p><button id=\"googleLogin\" class=\"btn btn-google\" type=\"button\">G&nbsp; Chọn tài khoản Google</button></div>`;document.getElementById('googleLogin').addEventListener('click',chooseAccount);primeOAuth().catch(()=>{})}
function showError(message){content.innerHTML=`<div class=\"error\">${esc(message)}</div><div class=\"signin\"><button class=\"btn btn-muted\" onclick=\"location.reload()\">Tải lại trang</button></div>`}
function googleReady(){return !!window.google?.accounts?.oauth2}
let oauthInitPromise=null;
function loadGoogleIdentity(force=false){if(googleReady())return Promise.resolve();return new Promise((resolve,reject)=>{if(force)document.querySelectorAll('script[data-gis-retry=\"1\"]').forEach(x=>x.remove());const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client?retry='+Date.now();script.async=true;script.defer=true;script.dataset.gisRetry='1';let settled=false,poll=null;const finish=err=>{if(settled)return;settled=true;clearTimeout(timer);if(poll)clearInterval(poll);err?reject(err):resolve()};script.onload=()=>{if(googleReady())return finish();let tries=0;poll=setInterval(()=>{if(googleReady())finish();else if(++tries>=40)finish(new Error('Google Identity chưa khởi tạo được'))},100)};script.onerror=()=>finish(new Error('Không tải được thư viện đăng nhập Google'));const timer=setTimeout(()=>finish(new Error('Google Identity tải quá lâu')),12000);document.head.appendChild(script)})}
async function initOAuth(force=false){if(tokenClient&&!force)return tokenClient;const cfg=await fetch('/api/lms/portal?endpoint=public-config',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json());if(!cfg?.googleClientId)throw new Error('Hệ thống đăng nhập Google chưa sẵn sàng.');let lastError=null;for(let i=0;i<3&&!googleReady();i++){try{await loadGoogleIdentity(force||i>0)}catch(e){lastError=e}}if(!googleReady())throw lastError||new Error('Không tải được Google Identity');tokenClient=google.accounts.oauth2.initTokenClient({client_id:cfg.googleClientId,scope:'openid email profile',prompt:'select_account',callback:async resp=>{if(!resp?.access_token){showLogin('Không nhận được quyền đăng nhập Google. Hãy thử lại.');return}content.innerHTML='<div class=\"loading\"><div class=\"spin\"></div>Đang tải khóa học của bạn…</div>';const {r,d}=await dashboard({accessToken:resp.access_token});if(r.ok&&d.success){render(d);return}showLogin(d.error||'Không xác thực được tài khoản học viên.')},error_callback:err=>showGoogleBlocked(err?.type||'Không mở được cửa sổ Google')});return tokenClient}
function primeOAuth(force=false){if(force)oauthInitPromise=null;if(!oauthInitPromise)oauthInitPromise=initOAuth(force).catch(err=>{oauthInitPromise=null;throw err});return oauthInitPromise}
function showGoogleBlocked(reason=''){account.textContent='';refreshBtn.hidden=true;content.innerHTML=`<div class=\"signin\"><div class=\"icon\">🔐</div><p>Google chưa mở được trong cửa sổ hiện tại. Hệ thống đã tự thử tải lại thư viện đăng nhập.</p><button id=\"retryGoogle\" class=\"btn btn-google\" type=\"button\">G&nbsp; Thử lại Google</button><p class=\"login-help\">Nếu bấm lại vẫn không hiện danh sách tài khoản, hãy dùng nút <b>⋯</b> của cửa sổ này và chọn <b>Mở trong Safari/Chrome</b>, rồi đăng nhập lại. ${reason?'<br><small>'+esc(reason)+'</small>':''}</p></div>`;document.getElementById('retryGoogle').addEventListener('click',chooseAccount)}
async function chooseAccount(){const btn=document.getElementById('googleLogin')||document.getElementById('retryGoogle');if(btn){btn.disabled=true;btn.textContent='Đang mở Google…'}try{const wasReady=!!tokenClient;await primeOAuth(!wasReady);if(!wasReady&&btn){btn.disabled=false;btn.innerHTML='G&nbsp; Chọn tài khoản Google';}tokenClient.requestAccessToken({prompt:'select_account'})}catch(e){showGoogleBlocked(e.message||String(e))}}
