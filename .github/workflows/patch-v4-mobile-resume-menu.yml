name: Apply V4 mobile resume/menu fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v4-mobile-resume-menu-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply functional patch
        run: node scripts/patch-v4-mobile-resume-menu.mjs
      - name: Validate
        run: npm test
      - name: Commit functional changes and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.html test/v4-mobile-resume-menu.test.js
          git rm scripts/patch-v4-mobile-resume-menu.mjs .github/workflows/patch-v4-mobile-resume-menu.yml
          git commit -m "fix: repair V4 resume and options menu"
          git push origin HEAD:${{ github.head_ref }}
