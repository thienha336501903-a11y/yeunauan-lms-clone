name: Patch V4 course manager

on:
  push:
    branches:
      - feat/v4-self-service-course-flow
    paths:
      - scripts/patch-v4-course-manager.mjs
      - .github/workflows/patch-v4-course-manager.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-self-service-course-flow
          fetch-depth: 0
      - name: Apply deterministic manager patch
        run: node scripts/patch-v4-course-manager.mjs
      - name: Validate patched manager
        run: |
          grep -q "Khóa học V4 của tôi" my-courses.html
          grep -q "deliveryMode||''" my-courses.html
          git diff --check
      - name: Commit patched manager
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-courses.html
          if git diff --cached --quiet; then
            echo "No manager changes to commit"
            exit 0
          fi
          git commit -m "feat: make student course manager V4-only"
          git push origin HEAD:feat/v4-self-service-course-flow
