name: One-time V4 source admin patch

on:
  push:
    branches:
      - feat/v4-source-admin-20260819

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-source-admin-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-v4-source-admin.mjs
      - name: Syntax checks
        run: |
          node --check api/lms/admin.js
          node --check utils/lms-handlers/admin-courses.js
          node --check utils/lms-handlers/admin-v4-source.js
      - name: Tests
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: manage V4 Telegram source from admin"
          git push origin HEAD:feat/v4-source-admin-20260819
