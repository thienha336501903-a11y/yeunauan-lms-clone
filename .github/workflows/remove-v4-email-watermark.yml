name: Remove V4 Email Watermark

on:
  push:
    branches:
      - agent/v4-stream-protection
    paths:
      - .github/workflows/remove-v4-email-watermark.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-stream-protection
      - name: Remove student email watermark only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('v4.html')
          text = path.read_text(encoding='utf-8')
          old_email = "mark.textContent=(lease.email||data?.email||'Học viên')+' • YeuNauAn';"
          new_email = "mark.hidden=true;"
          old_error = "video.addEventListener('error',()=>{clearInterval(markTimer);mark.textContent='Phiên phát video đã hết hạn — chạm tải lại trang để thử lại'});"
          new_error = "video.addEventListener('error',()=>{clearInterval(markTimer);mark.hidden=false;mark.textContent='Phiên phát video đã hết hạn — chạm tải lại trang để thử lại'});"
          assert text.count(old_email) == 1, f'expected one email watermark expression, got {text.count(old_email)}'
          assert text.count(old_error) == 1, f'expected one video error handler, got {text.count(old_error)}'
          text = text.replace(old_email, new_email, 1).replace(old_error, new_error, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify only intended behavior
        run: |
          grep -q "mark.hidden=true" v4.html
          ! grep -Fq "mark.textContent=(lease.email||data?.email||'Học viên')+' • YeuNauAn'" v4.html
          grep -q "X-V4-Playback" v4-media-sw.js
          grep -q "MAX_UPSTREAM_RANGE_BYTES = 8 \* 1024 \* 1024" v4-media-sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.html
          git commit -m "fix: remove V4 student email watermark"
          git push origin HEAD:agent/v4-stream-protection
