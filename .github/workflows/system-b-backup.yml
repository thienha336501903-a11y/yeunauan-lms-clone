name: System B encrypted database backup

on:
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-b-encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'thienha336501903-a11y/yeunauan-lms-clone'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYSTEM_ID: system-b
      SYSTEM_B_BACKUP_CLASS: ${{ github.event_name == 'schedule' && 'weekly' || 'manual' }}
      SYSTEM_B_BACKUP_DATABASE_URL: ${{ secrets.SYSTEM_B_BACKUP_DATABASE_URL }}
      SYSTEM_B_BACKUP_GPG_PUBLIC_KEY_B64: ${{ secrets.SYSTEM_B_BACKUP_GPG_PUBLIC_KEY_B64 }}
      R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate backup configuration presence
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SYSTEM_B_BACKUP_DATABASE_URL
            SYSTEM_B_BACKUP_GPG_PUBLIC_KEY_B64
            R2_BACKUP_ACCOUNT_ID
            R2_BACKUP_ACCESS_KEY_ID
            R2_BACKUP_SECRET_ACCESS_KEY
            R2_BACKUP_BUCKET
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install PostgreSQL 17 backup dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg jq postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${arch}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"
          command -v aws >/dev/null
          aws --version
          pg_dump --version
          [[ "$(pg_dump --version)" == "pg_dump (PostgreSQL) 17."* ]]
          gpg --version | head -n 1
          jq --version

      - name: Create encrypted backup and enforce retention
        run: bash scripts/system-b-backup.sh
