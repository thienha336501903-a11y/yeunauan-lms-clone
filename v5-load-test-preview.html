<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V5 Preview Load Test</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;max-width:900px;color:#173327}button{padding:10px 16px;margin:4px;border:0;border-radius:9px;background:#1c7c54;color:white;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#f3f6f4;padding:14px;border-radius:12px;overflow:auto}.warn{color:#a61b1b;font-weight:700}
</style>
</head>
<body>
<h1>V5 Preview Load Test</h1>
<p>Chỉ benchmark metadata/feed + playback lease bằng auth thật. Không tải byte video/R2.</p>
<p id="gate" class="warn"></p>
<div>
<button data-n="50">50 virtual learners</button>
<button data-n="100">100 virtual learners</button>
<button data-n="300">300 virtual learners</button>
</div>
<pre id="out">Chưa chạy.</pre>
<script>
const COURSE='clone-factory-test-phase2-range-20260907';
const ASSET='61b6fb30-e5b7-4a16-8657-fc376ec15892';
const out=document.getElementById('out');
const buttons=[...document.querySelectorAll('button[data-n]')];
const isPreview=/\.vercel\.app$/i.test(location.hostname);
if(!isPreview){document.getElementById('gate').textContent='BLOCKED: trang benchmark chỉ chạy trên Vercel Preview.';buttons.forEach(b=>b.disabled=true)}
function pct(values,p){if(!values.length)return null;const s=[...values].sort((a,b)=>a-b);return Math.round(s[Math.min(s.length-1,Math.ceil(p*s.length)-1)]*10)/10}
async function one(i){
  const start=performance.now();
  const feed=await fetch(`/api/lms/portal?endpoint=v5-feed&course=${encodeURIComponent(COURSE)}&lt=${Date.now()}-${i}`,{credentials:'include',cache:'no-store'});
  let feedBody={};try{feedBody=await feed.json()}catch{}
  const mid=performance.now();
  if(!feed.ok)return {ok:false,stage:'feed',status:feed.status,code:feedBody.code||feedBody.error||'',feedMs:mid-start,totalMs:mid-start};
  const play=await fetch(`/api/lms/portal?endpoint=v5-play&course=${encodeURIComponent(COURSE)}&asset=${encodeURIComponent(ASSET)}&lt=${Date.now()}-${i}`,{credentials:'include',cache:'no-store'});
  let playBody={};try{playBody=await play.json()}catch{}
  const end=performance.now();
  return {ok:play.ok,stage:play.ok?'done':'play',status:play.status,code:playBody.code||playBody.error||'',feedMs:mid-start,playMs:end-mid,totalMs:end-start};
}
async function run(n){
  buttons.forEach(b=>b.disabled=true);out.textContent=`Đang chạy ${n} virtual learners = ${n*2} authenticated function requests…`;
  const wallStart=performance.now();
  const rows=await Promise.all(Array.from({length:n},(_,i)=>one(i)));
  const wallMs=performance.now()-wallStart;
  const ok=rows.filter(r=>r.ok);const fail=rows.filter(r=>!r.ok);
  const report={
    virtualLearners:n,
    intendedRequests:n*2,
    passed:ok.length,
    failed:fail.length,
    successRatePct:Math.round(ok.length/n*10000)/100,
    wallMs:Math.round(wallMs),
    virtualLearnersPerSecond:Math.round(n/(wallMs/1000)*100)/100,
    feedMs:{p50:pct(rows.map(r=>r.feedMs),.5),p95:pct(rows.map(r=>r.feedMs),.95),p99:pct(rows.map(r=>r.feedMs),.99),max:pct(rows.map(r=>r.feedMs),1)},
    playMs:{p50:pct(ok.map(r=>r.playMs),.5),p95:pct(ok.map(r=>r.playMs),.95),p99:pct(ok.map(r=>r.playMs),.99),max:pct(ok.map(r=>r.playMs),1)},
    totalMs:{p50:pct(rows.map(r=>r.totalMs),.5),p95:pct(rows.map(r=>r.totalMs),.95),p99:pct(rows.map(r=>r.totalMs),.99),max:pct(rows.map(r=>r.totalMs),1)},
    failures:[...new Map(fail.map(r=>[`${r.stage}:${r.status}:${r.code}`,r])).keys()].slice(0,20)
  };
  out.textContent=JSON.stringify(report,null,2);
  buttons.forEach(b=>b.disabled=false);
}
buttons.forEach(b=>b.onclick=()=>run(Number(b.dataset.n)));
</script>
</body>
</html>
