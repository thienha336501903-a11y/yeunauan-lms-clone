<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mở kênh học viên</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dbe7ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#243746;padding:20px}.card{width:min(520px,100%);background:#fff;border-radius:18px;box-shadow:0 12px 38px rgba(41,76,99,.16);overflow:hidden}.head{background:#5682a3;color:#fff;padding:20px}.head h1{font-size:19px;margin:0 0 5px}.head p{font-size:12px;opacity:.82;margin:0}.body{padding:18px}.status{text-align:center;color:#71818d;font-size:13px;padding:18px}.spin{width:34px;height:34px;border:3px solid #dce7ed;border-top-color:#5682a3;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.courses{display:grid;gap:9px}.course{display:flex;align-items:center;gap:11px;width:100%;border:1px solid #dfe8ed;background:#f8fbfc;border-radius:13px;padding:12px;text-decoration:none;color:#233947;text-align:left;transition:.15s}.course:hover{border-color:#91b3c8;background:#f1f7fa}.avatar{width:42px;height:42px;border-radius:50%;background:#5682a3;color:#fff;display:grid;place-items:center;font-weight:800}.meta{min-width:0;flex:1}.name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slug{font-size:11px;color:#82919b;margin-top:3px}.back{display:block;text-align:center;margin-top:15px;color:#5682a3;text-decoration:none;font-size:12px;font-weight:700}.error{color:#a74444;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><h1>Telegram Channel Feed</h1><p>Chọn khóa học/kênh bạn muốn mở bằng giao diện thử nghiệm.</p></div>
    <div class="body">
      <div class="status" id="status"><div class="spin"></div>Đang kiểm tra quyền học viên…</div>
      <div class="courses" id="courses"></div>
      <a class="back" href="/">← Về hệ thống LMS Clone hiện tại</a>
    </div>
  </div>
<script>
(() => {
  const LMS_DEVICE_KEY='lms_device_id',LMS_SESSION_KEY='lms_verified_session_id',LMS_SESSION_ALIAS_KEY='lms_session_id';
  const status=document.getElementById('status'),list=document.getElementById('courses');
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  function headers(){try{const sid=localStorage.getItem(LMS_SESSION_KEY)||localStorage.getItem(LMS_SESSION_ALIAS_KEY)||'';const did=localStorage.getItem(LMS_DEVICE_KEY)||'';return sid&&did?{'X-LMS-Session-Id':sid,'X-LMS-Device-Id':did}:{};}catch{return {};}}
  async function getCourseInfo(slug){try{const r=await fetch('/api/lms/portal?endpoint=course-data',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({course:slug})});const d=await r.json();return r.ok&&d.allowed?d:null;}catch{return null;}}
  async function init(){try{const first=await getCourseInfo('');if(!first){status.innerHTML='<div class="error">Không tìm thấy phiên học viên hợp lệ. Hãy quay lại LMS Clone, đăng nhập/mở khóa học như bình thường rồi quay lại link thử nghiệm này.</div>';return;}const allowed=Array.isArray(first.allowedCourses)&&first.allowedCourses.length?first.allowedCourses:[first.course];status.style.display='none';const infos=await Promise.all(allowed.map(async slug=>slug===first.course?first:(await getCourseInfo(slug))));list.innerHTML=allowed.map((slug,i)=>{const d=infos[i];const title=d?.courseInfo?.title||slug;return `<a class="course" href="/channel.html?course=${encodeURIComponent(slug)}"><span class="avatar">${esc(String(title).charAt(0).toUpperCase())}</span><span class="meta"><span class="name">${esc(title)}</span><span class="slug">${esc(slug)} · ${(d?.lessons||[]).filter(x=>!x.isSection).length} bài đăng</span></span><span>›</span></a>`;}).join('');if(allowed.length===1)setTimeout(()=>location.href=`/channel.html?course=${encodeURIComponent(allowed[0])}`,450);}catch(e){status.innerHTML='<div class="error">Không thể tải danh sách khóa học. Vui lòng thử lại.</div>';}}
  init();
})();
</script>
</body>
</html>
