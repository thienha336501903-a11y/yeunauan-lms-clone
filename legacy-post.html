<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Khóa học</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--cream:#fcf8f2;--brown:#2d1914;--green:#2a4b2a;--orange:#d96b27;--muted:#746762}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--cream);color:var(--brown);font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;background:var(--cream)}.container{max-width:1100px;margin:0 auto;padding:3rem 1.5rem;min-height:100vh}
.nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}.nav a{display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1px solid rgba(45,25,20,.08);color:var(--brown);padding:.6rem 1.2rem;border-radius:12px;box-shadow:0 4px 10px rgba(45,25,20,.02);font-weight:600;font-size:.85rem;text-decoration:none;transition:all .25s ease}.nav a:hover{background:var(--cream);border-color:var(--orange);color:var(--orange);transform:translateX(-4px)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start;animation:fadeIn .6s cubic-bezier(.16,1,.3,1)}
.media{position:relative;width:100%;aspect-ratio:4/3;background:#faf6f0;border:1px solid rgba(45,25,20,.05);border-radius:28px;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 40px rgba(45,25,20,.04)}.media img{width:100%;height:100%;object-fit:contain;transition:transform .5s ease}.media:hover img{transform:scale(1.03)}.placeholder{font-size:64px;color:#baa9a0}
.info{display:flex;flex-direction:column;gap:1.5rem}.header{border-bottom:1px solid rgba(45,25,20,.08);padding-bottom:1.5rem}.meta{display:flex;align-items:center;gap:.45rem;color:rgba(45,25,20,.6);font-weight:500;font-size:.9rem;margin-bottom:.75rem}.meta svg{width:16px;height:16px;color:var(--orange);flex:0 0 auto}.title{font-family:"Playfair Display",serif;font-weight:800;color:var(--brown);font-size:2.75rem;line-height:1.2;letter-spacing:-.01em;margin:0 0 .75rem}
.entry-wrap{margin-top:1rem;display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}.entry{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;padding:.65rem 1.25rem;background:var(--green);color:#fff;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 6px 20px rgba(42,75,42,.15);transition:background .2s ease,box-shadow .2s ease,transform .2s ease;transform-origin:50% 70%;animation:entryNudge 4.8s .15s ease-in-out infinite}.entry:hover{background:#3e6b3e;transform:translateY(-2px);box-shadow:0 8px 25px rgba(42,75,42,.25);animation-play-state:paused}.entry:focus-visible{outline:3px solid rgba(217,107,39,.38);outline-offset:3px}.entry:disabled{cursor:wait;opacity:.72;transform:none;animation:none}.entry svg{width:16px;height:16px}.error{color:#b42318;font-size:.9rem;line-height:1.45;margin:0;max-width:32rem}
.recipe{background:#fff;border:1px solid rgba(45,25,20,.06);border-radius:28px;box-shadow:0 12px 40px rgba(45,25,20,.03);color:var(--brown);padding:2.25rem 2rem;user-select:none;-webkit-user-select:none}.recipe-head{border-bottom:1.5px dashed rgba(45,25,20,.1);padding-bottom:1.25rem;margin-bottom:1.75rem}.recipe-title{font-family:"Playfair Display",serif;font-size:1.5rem;font-weight:800;color:var(--brown);margin:0}.recipe-content{color:var(--brown);font-size:.975rem;line-height:1.75}.recipe-content p{color:#4a3e3b;margin:0 0 1rem}.recipe-content h3{font-family:"Playfair Display",serif;font-size:1.35rem;font-weight:800;color:var(--green);margin:1.75rem 0 .75rem;border-left:4px solid var(--orange);padding-left:.65rem;letter-spacing:-.01em}.recipe-content h3:first-child{margin-top:0}.recipe-content li{list-style:none;position:relative;color:#4a3e3b;padding-left:1.5rem;margin:0 0 .5rem;line-height:1.7}.recipe-content li:before{content:'•';position:absolute;left:.4rem;top:-.15rem;color:var(--orange);font-size:1.25rem;font-weight:700}.v4-intro-item{padding:0 0 1.35rem;margin:0 0 1.35rem;border-bottom:1px dashed rgba(45,25,20,.12)}.v4-intro-item:last-of-type{margin-bottom:0}.v4-intro-item.is-hidden{display:none}.v4-intro-label{display:flex;align-items:center;gap:.55rem;margin:0 0 .8rem;color:var(--green);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.v4-intro-label span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#edf4e8;color:var(--green)}.intro-toggle{width:100%;margin-top:.5rem;padding:.75rem 1rem;border:1px solid rgba(42,75,42,.22);border-radius:12px;background:#f6faf3;color:var(--green);font:inherit;font-weight:700;cursor:pointer}.intro-toggle:hover{background:#edf4e8}.intro-note{margin:.85rem 0 0;color:var(--muted);font-size:.78rem;line-height:1.5}.loading,.fatal{max-width:550px;margin:100px auto;padding:3rem 2rem;text-align:center;background:#fff;border:1px solid rgba(45,25,20,.08);border-radius:28px;color:var(--muted);box-shadow:0 12px 40px rgba(45,25,20,.04)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes entryNudge{0%,16%,100%{transform:translateY(0) scale(1);box-shadow:0 6px 20px rgba(42,75,42,.15)}4%{transform:translateY(-2px) rotate(-.35deg) scale(1.018);box-shadow:0 9px 25px rgba(42,75,42,.24)}8%{transform:translateY(0) rotate(.35deg) scale(1.01)}12%{transform:translateY(-1px) rotate(-.2deg) scale(1.014)}}
@media(prefers-reduced-motion:reduce){.entry{animation:none;transition:none}}
@media(max-width:968px){.grid{grid-template-columns:1fr;gap:2rem}.container{padding:2rem 1rem}.title{font-size:2.15rem}.recipe{padding:1.75rem 1.35rem}}
@media(max-width:520px){.container{padding:1.25rem .85rem}.nav{margin-bottom:1.35rem}.nav a{padding:.55rem .8rem;font-size:.76rem}.media{border-radius:22px}.title{font-size:1.85rem}.recipe{border-radius:22px}.entry{width:100%;padding:.85rem 1rem}.entry-wrap{align-items:stretch}}
</style>
</head>
<body>
<div class="page"><main class="container"><div id="app" class="loading">Đang kiểm tra quyền khóa học…</div></main></div>
<script>
(()=>{
  const app=document.getElementById('app');
  const qs=new URLSearchParams(location.search);
  const slug=String(qs.get('id')||qs.get('course')||'').trim();
  let sessionToken='';
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const icon=(name)=>name==='calendar'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';
  const formatDate=value=>{const date=new Date(value||'');return Number.isNaN(date.getTime())?'':date.toLocaleDateString('vi-VN',{year:'numeric',month:'long',day:'numeric'})};
  function introHtml(value){const text=String(value||'').trim()||'Nội dung chi tiết của khóa học hiện có trong hệ thống bài học gốc.';return text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{if(/^#{1,3}\s+/.test(line))return`<h3>${esc(line.replace(/^#{1,3}\s+/,''))}</h3>`;if(/^[-*•+]\s+/.test(line))return`<li>${esc(line.replace(/^[-*•+]\s+/,''))}</li>`;return`<p>${esc(line)}</p>`}).join('')}
  function v4IntroHtml(payload,fallback){const items=Array.isArray(payload?.items)?payload.items:[];if(!items.length)return introHtml(fallback);const visible=3;const sections=items.map((item,index)=>`<article class="v4-intro-item${index>=visible?' is-hidden':''}" data-v4-intro-extra="${index>=visible?'1':'0'}"><div class="v4-intro-label"><span>${index+1}</span> Nội dung lớp học</div>${introHtml(item.text)}</article>`).join('');const toggle=items.length>visible?`<button id="introToggle" class="intro-toggle" type="button" aria-expanded="false">Xem toàn bộ ${items.length} phần nội dung</button>`:'';const note=payload?.complete===false?'<p class="intro-note">Đang hiển thị phần nội dung đã tổng hợp được; quản trị viên cần chạy lại Kiểm tra trước phát hành để xác nhận đầy đủ.</p>':'';return sections+toggle+note}

  async function loadV4Intro(){
    const response=await fetch(`/api/lms/portal?endpoint=v4-course-intro&course=${encodeURIComponent(slug)}`,{method:'GET',credentials:'same-origin',cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.success)throw new Error(data.error||'Không tải được nội dung giới thiệu V4');
    return data.intro||null;
  }

  async function dashboard(){
    const body=sessionToken?{sessionToken}:{};
    const response=await fetch('/api/lms/portal?endpoint=student-dashboard',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'
    });
    let data={};
    try{data=await response.json()}catch{}
    return{response,data};
  }

  function portalDeviceId(){
    const key='portal_device_id';
    try{
      let value=localStorage.getItem(key);
      if(!value){
        const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
        value='portal_'+Array.from(bytes).map(item=>item.toString(16).padStart(2,'0')).join('');
        localStorage.setItem(key,value);
      }
      return value;
    }catch{return'portal_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
  }

  async function enterCourse(){
    const button=document.getElementById('enter');
    const errorBox=document.getElementById('err');
    button.disabled=true;button.textContent='Đang tạo liên kết...';errorBox.textContent='';
    try{
      const response=await fetch('/api/lms/portal?endpoint=legacy-entry-token',{
        method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({course_slug:slug,portal_device_id:portalDeviceId()})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.ok||!data.url) throw new Error(data.error||'Không tạo được liên kết vào lớp.');
      location.assign(data.url);
    }catch(error){
      errorBox.textContent=error.message||'Không tạo được liên kết vào lớp. Vui lòng đăng nhập đúng Gmail đã mua khóa học rồi thử lại.';
      button.disabled=false;button.innerHTML=icon('graduate')+'<span>Bài học gốc phục vụ giảng dạy</span>';
    }
  }

  (async()=>{
    if(!slug){app.className='fatal';app.textContent='Thiếu mã khóa học.';return}
    const{response,data}=await dashboard();
    if(!response.ok||!data.success){location.replace('/my-courses.html');return}
    sessionToken=String(data.sessionToken||'');
    const course=(data.courses||[]).find(item=>{
      const mode=String(item.deliveryMode||'lms').trim().toLowerCase();
      return String(item.slug||'').toLowerCase()===slug.toLowerCase()&&['lms','v4'].includes(mode);
    });
    if(!course||course.state!=='ready'){location.replace('/my-courses.html');return}
    const mode=String(course.deliveryMode||'lms').trim().toLowerCase();
    let v4Intro=null;
    if(mode==='v4'){
      try{v4Intro=await loadV4Intro()}catch(error){console.warn('[legacy-post] V4 intro fallback',error?.message||error)}
    }
    const image=course.imageUrl?`<img src="${esc(course.imageUrl)}" alt="${esc(course.title||course.slug)}">`:'<div class="placeholder">📖</div>';
    const dateLabel=formatDate(course.createdAt||course.expectedStartDate||course.updatedAt)||'Khóa học trực tuyến';
    app.className='';
    app.innerHTML=`<div class="nav"><a href="/">← Quay lại cổng học viên</a><a href="/my-courses.html">${icon('graduate')} Khóa học của tôi</a></div><div class="grid"><div class="media">${image}</div><section class="info"><header class="header"><div class="meta">${icon('calendar')}<span>${esc(dateLabel)}</span></div><h1 class="title">${esc(course.title||course.slug)}</h1><div class="entry-wrap"><button id="enter" class="entry">${icon('graduate')}<span>Bài học gốc phục vụ giảng dạy</span></button><p id="err" class="error" role="alert"></p></div></header><div class="recipe"><div class="recipe-head"><h2 class="recipe-title">Công Thức &amp; Hướng Dẫn</h2></div><div class="recipe-content">${mode==='v4'?v4IntroHtml(v4Intro,course.description):introHtml(course.description)}</div></div></section></div>`;
    document.getElementById('enter').addEventListener('click',enterCourse);
    const introToggle=document.getElementById('introToggle');
    if(introToggle)introToggle.addEventListener('click',()=>{const expanded=introToggle.getAttribute('aria-expanded')==='true';document.querySelectorAll('[data-v4-intro-extra="1"]').forEach(item=>item.classList.toggle('is-hidden',expanded));introToggle.setAttribute('aria-expanded',String(!expanded));introToggle.textContent=expanded?`Xem toàn bộ ${v4Intro.items.length} phần nội dung`:'Thu gọn nội dung'});
  })();
})();
</script>
</body>
</html>
