<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khóa học</title><style>:root{--bg:#0a0c10;--card:#0e1217;--border:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:2rem 1.5rem}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:2rem}.nav a{color:var(--muted);text-decoration:none;font-size:.9rem}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:3rem;align-items:start}.media{aspect-ratio:4/3;background:#000;border:1px solid var(--border);border-radius:16px;overflow:hidden;display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:64px;color:#4b5563}.meta{color:var(--muted);font-size:.9rem;margin-bottom:.8rem}.title{font-size:2.25rem;line-height:1.2;margin:0 0 1.2rem;background:linear-gradient(135deg,#fff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.entry{width:100%;border:0;border-radius:10px;padding:13px 16px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.entry:disabled{opacity:.6}.error{color:#f87171;font-size:.85rem;line-height:1.5;margin-top:10px}.recipe{margin-top:1.5rem;padding:1.5rem;border-radius:16px;border:1px solid var(--border);background:rgba(22,28,38,.6)}.recipe h3{margin:0 0 .7rem;color:var(--accent)}.recipe p{color:var(--muted);line-height:1.6;margin:0}.loading{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr;gap:1.5rem}.title{font-size:1.7rem}.container{padding:1.25rem 1rem}}</style></head><body><main class="container"><div id="app" class="loading">Đang kiểm tra quyền khóa học…</div></main><script>(()=>{const app=document.getElementById('app'),qs=new URLSearchParams(location.search),slug=String(qs.get('id')||qs.get('course')||'').trim();let sessionToken='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function dash(){const body=sessionToken?{sessionToken}:{};const r=await fetch('/api/lms/portal?endpoint=student-dashboard',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});let d={};try{d=await r.json()}catch{}return{r,d}}function device(){const k='portal_device_id';try{let v=localStorage.getItem(k);if(!v){const a=new Uint8Array(24);crypto.getRandomValues(a);v='portal_'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(k,v)}return v}catch{return'portal_'+Date.now()+'_'+Math.random().toString(36).slice(2)}}async function enter(){const b=document.getElementById('enter'),err=document.getElementById('err');b.disabled=true;b.textContent='Đang tạo liên kết...';err.textContent='';try{const r=await fetch('/api/lms/portal?endpoint=legacy-entry-token',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_slug:slug,portal_device_id:device()})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok||!d.url)throw new Error(d.error||'Không tạo được liên kết vào lớp.');location.assign(d.url)}catch(e){err.textContent=e.message||'Không tạo được liên kết vào lớp. Vui lòng đăng nhập đúng Gmail đã mua khóa học rồi thử lại.';b.disabled=false;b.textContent='🎓 Bài học gốc phục vụ giảng dạy'}}(async()=>{if(!slug){app.innerHTML='<div class="error">Thiếu mã khóa học.</div>';return}const{r,d}=await dash();if(!r.ok||!d.success){location.replace('/my-courses');return}sessionToken=String(d.sessionToken||'');const c=(d.courses||[]).find(x=>String(x.slug||'').toLowerCase()===slug.toLowerCase()&&String(x.deliveryMode||'lms').toLowerCase()==='lms');if(!c||c.state!=='ready'){location.replace('/my-courses');return}const img=c.imageUrl?`<img src="${esc(c.imageUrl)}" alt="">`:'<div class="placeholder">📖</div>';app.className='';app.innerHTML=`<div class="nav"><a href="/">← Quay lại cổng học viên</a><a href="/my-courses">🎓 Khóa học của tôi</a></div><div class="grid"><div class="media">${img}</div><div><div class="meta">Khóa học trực tuyến</div><h1 class="title">${esc(c.title||c.slug)}</h1><button id="enter" class="entry">🎓 Bài học gốc phục vụ giảng dạy</button><div id="err" class="error"></div><div class="recipe"><h3>Nội dung khóa học</h3><p>Nhấn nút phía trên để mở hệ thống bài học gốc của khóa học.</p></div></div></div>`;document.getElementById('enter').onclick=enter})();})();</script></body></html>
