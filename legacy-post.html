<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Khóa học</title>
<style>
:root{--bg:#0a0c10;--card:#0e1217;--border:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.container{max-width:1100px;margin:auto;padding:2rem 1.5rem}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:2rem}.nav a{color:var(--muted);text-decoration:none;font-size:.9rem}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:3rem;align-items:start}.media{aspect-ratio:4/3;background:#000;border:1px solid var(--border);border-radius:16px;overflow:hidden;display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:64px;color:#4b5563}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:.8rem}.title{font-size:2.25rem;line-height:1.2;margin:0 0 1.2rem;background:linear-gradient(135deg,#fff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.entry{width:100%;border:0;border-radius:10px;padding:13px 16px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.entry:disabled{opacity:.6}.error{color:#f87171;font-size:.85rem;line-height:1.5;margin-top:10px}
.recipe{margin-top:1.5rem;padding:1.5rem;border-radius:16px;border:1px solid var(--border);background:rgba(22,28,38,.6)}.recipe h3{margin:0 0 .7rem;color:var(--accent)}.recipe p{color:var(--muted);line-height:1.6;margin:0}.loading{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr;gap:1.5rem}.title{font-size:1.7rem}.container{padding:1.25rem 1rem}}
</style>
</head>
<body>
<main class="container"><div id="app" class="loading">Đang kiểm tra quyền khóa học…</div></main>
<script>
(()=>{
  const app=document.getElementById('app');
  const qs=new URLSearchParams(location.search);
  const slug=String(qs.get('id')||qs.get('course')||'').trim();
  let sessionToken='';
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

  async function dashboard(){
    const body=sessionToken?{sessionToken}:{};
    const response=await fetch('/api/lms/portal?endpoint=student-dashboard',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'
    });
    let data={};
    try{data=await response.json()}catch{}
    return{response,data};
  }

  function portalDeviceId(){
    const key='portal_device_id';
    try{
      let value=localStorage.getItem(key);
      if(!value){
        const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
        value='portal_'+Array.from(bytes).map(item=>item.toString(16).padStart(2,'0')).join('');
        localStorage.setItem(key,value);
      }
      return value;
    }catch{return'portal_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
  }

  async function enterCourse(){
    const button=document.getElementById('enter');
    const errorBox=document.getElementById('err');
    button.disabled=true;button.textContent='Đang tạo liên kết...';errorBox.textContent='';
    try{
      const response=await fetch('/api/lms/portal?endpoint=legacy-entry-token',{
        method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({course_slug:slug,portal_device_id:portalDeviceId()})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.ok||!data.url) throw new Error(data.error||'Không tạo được liên kết vào lớp.');
      location.assign(data.url);
    }catch(error){
      errorBox.textContent=error.message||'Không tạo được liên kết vào lớp. Vui lòng đăng nhập đúng Gmail đã mua khóa học rồi thử lại.';
      button.disabled=false;button.textContent='🎓 Bài học gốc phục vụ giảng dạy';
    }
  }

  (async()=>{
    if(!slug){app.innerHTML='<div class="error">Thiếu mã khóa học.</div>';return}
    const{response,data}=await dashboard();
    if(!response.ok||!data.success){location.replace('/my-courses.html');return}
    sessionToken=String(data.sessionToken||'');
    const course=(data.courses||[]).find(item=>{
      const mode=String(item.deliveryMode||'lms').trim().toLowerCase();
      return String(item.slug||'').toLowerCase()===slug.toLowerCase()&&['lms','v4'].includes(mode);
    });
    if(!course||course.state!=='ready'){location.replace('/my-courses.html');return}
    const image=course.imageUrl?`<img src="${esc(course.imageUrl)}" alt="">`:'<div class="placeholder">📖</div>';
    app.className='';
    app.innerHTML=`<div class="nav"><a href="/">← Quay lại cổng học viên</a><a href="/my-courses.html">🎓 Khóa học của tôi</a></div><div class="grid"><div class="media">${image}</div><div><div class="meta">Khóa học trực tuyến</div><h1 class="title">${esc(course.title||course.slug)}</h1><button id="enter" class="entry">🎓 Bài học gốc phục vụ giảng dạy</button><div id="err" class="error"></div><div class="recipe"><h3>Nội dung khóa học</h3><p>Nhấn nút phía trên để mở hệ thống bài học gốc của khóa học.</p></div></div></div>`;
    document.getElementById('enter').addEventListener('click',enterCourse);
  })();
})();
</script>
</body>
</html>
