<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Kênh bài học - Upload nền + đếm media</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe7ef}
    iframe{display:block;width:100%;height:100%;border:0;background:#dfe7ef}
  </style>
</head>
<body>
<iframe id="admin" src="/channel-admin-bg.html" title="Admin Upload nền"></iframe>
<script>
(() => {
  const frame=document.getElementById('admin');
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    if(!doc)return;
    if(doc.getElementById('draft-media-counter'))return;

    const style=doc.createElement('style');
    style.textContent=`
      .draft-media-counter{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:9px 11px;border:1px solid #cfe1ec;border-radius:11px;background:#eef8fd;color:#456273;font-size:11px;line-height:1.35}
      .draft-media-counter.show{display:flex}
      .draft-media-counter strong{font-size:12px;color:#1f5f82}
      .draft-media-counter .pill{padding:3px 7px;border-radius:999px;background:#fff;border:1px solid #d8e7ef;white-space:nowrap}
      @media(max-width:820px){.draft-media-counter{margin-bottom:8px;padding:8px 9px}}
    `;
    doc.head.appendChild(style);

    const dropZone=doc.getElementById('dropZone');
    const draftList=doc.getElementById('draftList');
    const hint=doc.getElementById('composerHint');
    if(!dropZone||!draftList)return;

    const counter=doc.createElement('div');
    counter.id='draft-media-counter';
    counter.className='draft-media-counter';
    dropZone.insertBefore(counter,draftList);

    const originalHint=hint?.textContent||'';
    const unitBytes={B:1,KB:1024,MB:1024*1024,GB:1024*1024*1024};
    function parseSize(text){
      const m=String(text||'').match(/([0-9]+(?:\.[0-9]+)?)\s*(B|KB|MB|GB)\b/i);
      return m?Number(m[1])*(unitBytes[m[2].toUpperCase()]||1):0;
    }
    function fmtBytes(n){
      if(n<1024)return `${Math.round(n)} B`;
      if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;
      if(n<1024*1024*1024)return `${(n/1024/1024).toFixed(1)} MB`;
      return `${(n/1024/1024/1024).toFixed(2)} GB`;
    }
    function plural(n,label){return n?`<span class="pill">${n} ${label}</span>`:'';}
    function update(){
      const rows=[...draftList.querySelectorAll('.draft-file')];
      if(!rows.length){
        counter.classList.remove('show');
        counter.innerHTML='';
        if(hint)hint.textContent=originalHint;
        return;
      }
      let images=0,videos=0,docs=0,bytes=0;
      rows.forEach(row=>{
        const sub=row.querySelector('.fsub')?.textContent||'';
        if(/^\s*Ảnh\b/i.test(sub))images++;
        else if(/^\s*Video\b/i.test(sub))videos++;
        else docs++;
        bytes+=parseSize(sub);
      });
      const parts=[plural(images,'ảnh'),plural(videos,'video'),plural(docs,'tài liệu')].filter(Boolean).join('');
      counter.innerHTML=`<strong>Đã chọn ${rows.length} file</strong>${parts}<span class="pill">${fmtBytes(bytes)}</span>`;
      counter.classList.add('show');
      if(hint)hint.textContent=`Đã chọn ${rows.length} file • ${images} ảnh${videos?` • ${videos} video`:''}${docs?` • ${docs} tài liệu`:''} • ${fmtBytes(bytes)}`;
    }

    update();
    new MutationObserver(update).observe(draftList,{childList:true,subtree:true,characterData:true});
  });
})();
</script>
</body>
</html>
