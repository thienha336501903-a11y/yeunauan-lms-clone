<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Đang chuẩn bị trình phát…</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2ef;color:#31443a}body{min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:34px;height:34px;border:3px solid #dce6df;border-top-color:#5a8f58;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:13px;color:#718078}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div class="msg">Đang chuẩn bị trình phát an toàn…</div></div>
<script>
(()=>{
  const WORKER_PATH='/v4-media-sw.js?v=2';
  const NEXT='/v4-entry.html'+location.search;
  const desiredUrl=new URL(WORKER_PATH,location.origin).href;
  const currentIsDesired=()=>String(navigator.serviceWorker?.controller?.scriptURL||'')===desiredUrl;
  const go=()=>location.replace(NEXT);

  if(!('serviceWorker'in navigator)){go();return}
  if(currentIsDesired()){go();return}

  (async()=>{
    try{
      const registration=await navigator.serviceWorker.register(WORKER_PATH,{scope:'/',updateViaCache:'none'});
      try{await registration.update()}catch{}
      if(currentIsDesired()){go();return}

      await new Promise(resolve=>{
        let settled=false;
        const finish=()=>{if(settled)return;settled=true;clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',onChange);resolve()};
        const onChange=()=>{if(currentIsDesired())finish()};
        const timer=setTimeout(finish,6000);
        navigator.serviceWorker.addEventListener('controllerchange',onChange);
        onChange();
      });
    }catch{}
    go();
  })();
})();
</script>
</body>
</html>
