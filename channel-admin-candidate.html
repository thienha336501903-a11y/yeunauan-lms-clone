<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Kênh bài học - Admin Candidate</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe7ef}
    iframe{display:block;width:100%;height:100%;border:0;background:#dfe7ef}
  </style>
</head>
<body>
<iframe id="admin" title="Telegram Channel Admin Candidate"></iframe>
<script>
(() => {
  const outer=document.getElementById('admin');
  const target=new URL('/channel-admin-bg-count.html',location.origin);
  outer.src=target.toString();
  const qs=new URLSearchParams(location.search);
  const requested=String(qs.get('course')||'').trim();
  const norm=v=>String(v||'').trim().toLowerCase();

  function findAdminDoc(doc){
    if(!doc)return null;
    if(doc.getElementById('courseSelect')&&doc.getElementById('channelTitle'))return doc;
    for(const frame of [...doc.querySelectorAll('iframe')]){
      try{const found=findAdminDoc(frame.contentDocument);if(found)return found;}catch{}
    }
    return null;
  }

  function install(doc){
    if(doc.getElementById('candidate-course-guard'))return true;
    const select=doc.getElementById('courseSelect');
    const main=doc.querySelector('main');
    if(!select||!main||!select.options.length)return false;

    const style=doc.createElement('style');
    style.id='candidate-course-guard-style';
    style.textContent=`
      .candidate-course-guard{max-width:760px;margin:0 auto 12px;padding:10px 12px;border-radius:12px;border:1px solid #bcdceb;background:#edf8fd;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(43,88,114,.08);color:#36576b}
      .candidate-course-guard.locked{border-color:#9fd6ba;background:#eefaf3;color:#286348}
      .candidate-course-guard.warn{border-color:#e8c28a;background:#fff7ea;color:#855d23}
      .candidate-course-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:0 0 auto}
      .candidate-course-copy{min-width:0;flex:1}.candidate-course-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.75}.candidate-course-name{font-size:13px;font-weight:850;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.candidate-course-note{font-size:10px;margin-top:2px;opacity:.78}
      .candidate-course-action{flex:0 0 auto;border:0;border-radius:9px;padding:7px 10px;background:#fff;color:#527084;font-size:10px;font-weight:800;text-decoration:none;box-shadow:0 1px 5px rgba(0,0,0,.06)}
      #courseSelect:disabled{opacity:.72;cursor:not-allowed;background:#f3f6f8}
      @media(max-width:820px){.candidate-course-guard{margin:0 auto 10px;padding:9px 10px}.candidate-course-name{font-size:12px}.candidate-course-action{padding:6px 8px}}
    `;
    doc.head.appendChild(style);

    const bar=doc.createElement('div');
    bar.id='candidate-course-guard';
    bar.className='candidate-course-guard';
    main.insertBefore(bar,main.firstChild);

    function selectedLabel(){return select.options[select.selectedIndex]?.textContent?.trim()||select.value||'Chưa chọn khóa';}
    function render(mode='normal',message=''){
      bar.className=`candidate-course-guard ${mode==='locked'?'locked':mode==='warn'?'warn':''}`;
      const locked=mode==='locked';
      bar.innerHTML=`<div class="candidate-course-icon">${locked?'🔒':'📚'}</div><div class="candidate-course-copy"><div class="candidate-course-label">Đang đăng vào khóa</div><div class="candidate-course-name">${selectedLabel()}</div><div class="candidate-course-note">${message||(locked?'Khóa học đã được cố định theo link Candidate để tránh đăng nhầm.':'Kiểm tra đúng khóa trước khi thêm media và bấm Đăng nền.')}</div></div>${locked?'<a class="candidate-course-action" href="/channel-admin-candidate.html">Đổi khóa</a>':''}`;
    }

    if(requested){
      const options=[...select.options];
      const match=options.find(o=>o.value===requested)||options.find(o=>norm(o.value)===norm(requested));
      if(match){
        if(select.value!==match.value){
          select.value=match.value;
          select.dispatchEvent(new doc.defaultView.Event('change',{bubbles:true}));
        }
        select.disabled=true;
        render('locked');
      }else{
        render('warn',`Không tìm thấy mã khóa “${requested}”. Hệ thống chưa khóa lựa chọn; hãy kiểm tra lại trước khi đăng.`);
      }
    }else{
      render('normal');
      select.addEventListener('change',()=>setTimeout(()=>render('normal'),0));
    }
    return true;
  }

  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    try{const doc=findAdminDoc(outer.contentDocument);if(doc&&install(doc)){clearInterval(timer);return;}}catch{}
    if(tries>320)clearInterval(timer);
  },125);
})();
</script>
</body>
</html>
