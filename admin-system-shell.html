<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Culinary CMS - Clone V2/V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
    #core{display:block;width:100%;height:100%;border:0;background:#f8fafc}
  </style>
</head>
<body>
  <iframe id="core" src="/admin.html?embedded=1" title="Culinary LMS Admin"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('core');
    let timer=null;

    function install(){
      let d,w;
      try{d=frame.contentDocument;w=frame.contentWindow;}catch{return false;}
      if(!d||!w||typeof w.switchTab!=='function')return false;
      if(d.getElementById('tabBtn-system')&&d.getElementById('tabContent-system'))return true;

      const aside=d.querySelector('#appShell aside');
      const lessons=d.getElementById('tabContent-lessons');
      const workspace=lessons?.parentElement;
      if(!aside||!workspace)return false;

      const btn=d.createElement('button');
      btn.id='tabBtn-system';
      btn.className='tab-btn flex-grow lg:flex-none flex items-center justify-center lg:justify-start gap-2.5 py-4 lg:py-3 px-5 text-sm font-bold border-b-2 lg:border-b-0 lg:border-l-4 border-transparent text-slate-500 hover:bg-slate-50 transition';
      btn.innerHTML='⚙️ Hệ Thống';
      btn.addEventListener('click',()=>{w.switchTab('system');w.__cloneLoadLearningMode?.();});
      aside.appendChild(btn);

      const panel=d.createElement('div');
      panel.id='tabContent-system';
      panel.className='tab-content hidden flex-grow space-y-4';
      panel.innerHTML=`
        <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm">
          <div class="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-lg font-extrabold text-slate-800">Chế độ hệ thống (V2 / V3)</h2>
                <span class="text-[10px] font-black px-2 py-1 rounded-full bg-sky-50 text-sky-700 border border-sky-100">CLONE</span>
              </div>
              <p class="text-xs text-slate-500 mt-1 leading-relaxed max-w-4xl">V2 giữ nguyên hệ thống học hiện tại. V3 là trải nghiệm Telegram Channel LMS. Việc chuyển mode chỉ điều khiển URL học viên chung <b>/learning</b>; các URL V2/V3 trực tiếp vẫn giữ nguyên để A/B test và rollback.</p>
            </div>
            <button id="systemRefreshBtn" class="text-xs font-bold text-slate-500 hover:text-slate-800 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50">↻ Làm mới</button>
          </div>

          <div class="mt-5 bg-slate-50 border border-slate-100 rounded-2xl p-4 flex flex-wrap items-center gap-3">
            <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">Chế độ hiện tại</span>
            <span id="systemModeBadge" class="text-xs font-black px-3 py-1.5 rounded-full bg-slate-200 text-slate-600">Đang tải...</span>
            <span id="systemModeDesc" class="text-xs font-bold text-slate-600"></span>
            <span id="systemModeSource" class="text-[10px] text-slate-400 ml-auto"></span>
          </div>

          <div class="grid md:grid-cols-2 gap-3 mt-4">
            <button id="systemModeV2" class="text-left border-2 border-slate-200 rounded-2xl p-4 hover:border-emerald-300 hover:bg-emerald-50/40 transition">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="text-sm font-black text-slate-800">📚 V2 — Hệ thống học hiện tại</div>
                  <div class="text-xs text-slate-500 mt-1 leading-relaxed">Giữ nguyên giao diện LMS hiện tại, bài học theo trang truyền thống.</div>
                </div>
                <span data-check="v2" class="hidden text-emerald-600 text-xl font-black">✓</span>
              </div>
            </button>
            <button id="systemModeV3" class="text-left border-2 border-slate-200 rounded-2xl p-4 hover:border-sky-300 hover:bg-sky-50/40 transition">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="text-sm font-black text-slate-800">💬 V3 — Telegram Channel LMS</div>
                  <div class="text-xs text-slate-500 mt-1 leading-relaxed">Feed liên tục, media mosaic, preview, phụ lục tự động và Admin upload nền.</div>
                </div>
                <span data-check="v3" class="hidden text-sky-600 text-xl font-black">✓</span>
              </div>
            </button>
          </div>

          <div id="systemModeMessage" class="min-h-[18px] mt-3 text-xs font-bold text-slate-500"></div>
        </div>

        <div class="grid lg:grid-cols-2 gap-4">
          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
            <h3 class="text-sm font-black text-slate-800">Đường dẫn học viên</h3>
            <p class="text-xs text-slate-500 mt-1">URL chung tự route theo mode đang bật. URL trực tiếp vẫn bỏ qua mode để kiểm thử.</p>
            <div class="grid sm:grid-cols-2 gap-2 mt-4">
              <button id="systemOpenLearning" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl">↗ Mở URL học viên chung</button>
              <button id="systemOpenV3Student" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-100 text-xs font-bold py-2.5 px-3 rounded-xl">↗ Mở V3 trực tiếp</button>
            </div>
          </div>
          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
            <h3 class="text-sm font-black text-slate-800">Quản trị V3</h3>
            <p class="text-xs text-slate-500 mt-1">Mở Telegram composer có Background Upload Queue. Nếu đang chọn khóa ở tab Bài học, link sẽ mang theo đúng course đó.</p>
            <div class="grid sm:grid-cols-2 gap-2 mt-4">
              <button id="systemOpenV3Admin" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl">💬 Mở Admin V3</button>
              <a href="/system-mode.html" target="_blank" class="text-center bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl">Trang mode độc lập</a>
            </div>
          </div>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-800 leading-relaxed">
          <b>Fail-safe:</b> nếu cấu hình hoặc API mode gặp lỗi, URL học viên chung luôn quay về V2. Chuyển V2/V3 không sửa schema, bài học, enrollment hoặc dữ liệu Drive.
        </div>
      `;
      workspace.appendChild(panel);

      const badge=d.getElementById('systemModeBadge');
      const desc=d.getElementById('systemModeDesc');
      const source=d.getElementById('systemModeSource');
      const msg=d.getElementById('systemModeMessage');
      const v2=d.getElementById('systemModeV2');
      const v3=d.getElementById('systemModeV3');

      function headers(){
        try{return typeof w.authHeaders==='function'?w.authHeaders():{'Content-Type':'application/json'};}catch{return {'Content-Type':'application/json'};}
      }
      function currentCourse(){return String(d.getElementById('courseSelect')?.value||'').trim();}
      function withCourse(path){const c=currentCourse();return c?path+(path.includes('?')?'&':'?')+'course='+encodeURIComponent(c):path;}
      function paint(mode,meta={}){
        mode=mode==='v3'?'v3':'v2';
        const isV3=mode==='v3';
        badge.textContent=mode.toUpperCase();
        badge.className='text-xs font-black px-3 py-1.5 rounded-full '+(isV3?'bg-sky-100 text-sky-700':'bg-emerald-100 text-emerald-700');
        desc.textContent=isV3?'Telegram Channel LMS đang được dùng cho URL học viên chung.':'LMS hiện tại đang được dùng cho URL học viên chung.';
        source.textContent=meta.source?('Nguồn: '+meta.source):'';
        v2.classList.toggle('border-emerald-500',!isV3);v2.classList.toggle('bg-emerald-50',!isV3);v2.classList.toggle('border-slate-200',isV3);
        v3.classList.toggle('border-sky-500',isV3);v3.classList.toggle('bg-sky-50',isV3);v3.classList.toggle('border-slate-200',!isV3);
        d.querySelector('[data-check="v2"]')?.classList.toggle('hidden',isV3);
        d.querySelector('[data-check="v3"]')?.classList.toggle('hidden',!isV3);
      }
      async function loadMode(){
        msg.textContent='Đang tải trạng thái...';
        try{
          const r=await w.fetch('/api/lms/admin?endpoint=learning-mode',{method:'GET',headers:headers(),cache:'no-store'});
          const x=await r.json();
          if(!r.ok||!x.success)throw new Error(x.error||'Không tải được mode');
          paint(x.activeMode,x);msg.textContent='';
        }catch(e){paint('v2',{source:'fallback'});msg.textContent='Không đọc được mode; giao diện đang hiển thị fallback V2. '+(e?.message||'');}
      }
      async function setMode(mode){
        const label=mode==='v3'?'V3 — Telegram Channel':'V2 — LMS hiện tại';
        if(!w.confirm('Chuyển URL học viên chung sang '+label+'?'))return;
        v2.disabled=v3.disabled=true;msg.textContent='Đang chuyển mode...';
        try{
          const r=await w.fetch('/api/lms/admin?endpoint=learning-mode',{method:'POST',headers:headers(),body:JSON.stringify({mode})});
          const x=await r.json();
          if(!r.ok||!x.success)throw new Error(x.error||'Chuyển mode thất bại');
          paint(x.activeMode,{source:'site_config'});msg.textContent='✓ Đã chuyển URL học viên chung sang '+x.activeMode.toUpperCase()+'.';
          try{w.toast?.('Đã chuyển hệ thống sang '+x.activeMode.toUpperCase());}catch{}
        }catch(e){msg.textContent='Lỗi chuyển mode: '+(e?.message||'Không xác định');try{w.toast?.('Chuyển mode thất bại','error');}catch{}}
        finally{v2.disabled=v3.disabled=false;}
      }

      w.__cloneLoadLearningMode=loadMode;
      w.__cloneSetLearningMode=setMode;
      d.getElementById('systemRefreshBtn').addEventListener('click',loadMode);
      v2.addEventListener('click',()=>setMode('v2'));
      v3.addEventListener('click',()=>setMode('v3'));
      d.getElementById('systemOpenLearning').addEventListener('click',()=>w.open(withCourse('/learning'),'_blank'));
      d.getElementById('systemOpenV3Student').addEventListener('click',()=>w.open(withCourse('/channel-candidate.html'),'_blank'));
      d.getElementById('systemOpenV3Admin').addEventListener('click',()=>w.open(withCourse('/channel-admin-candidate.html'),'_blank'));

      return true;
    }

    function start(){
      if(timer)clearInterval(timer);
      let tries=0;
      timer=setInterval(()=>{tries++;if(install()||tries>300){clearInterval(timer);timer=null;}},100);
    }
    frame.addEventListener('load',start);
    start();
  })();
  </script>
</body>
</html>
